<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .kaomoji-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            opacity: 0.15;
            font-size: 1.8rem;
            color: #fbbf24;
            user-select: none;
        }
        .grid {
            max-width: 900px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 10;
        }
        .card {
            background: #2b1810;
            border: 3px solid #34d399;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 260px;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .card-emoji-pic {
            font-size: 4rem;
            margin-bottom: 20px;
            user-select: none;
        }
        .btn {
            display: block;
            background: #fbbf24;
            color: #1f110a;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="kaomoji-bg">
        <span>(◌⚈  ⚈◌)</span><span>🌿</span><span>(〃ω〃)</span><span>🍫</span>
        <span>(*^ω^*)</span><span>(◕‿◕✿)</span><span>🌿</span><span>(｡♥‿♥｡)</span>
        <span>🍫</span><span>(＾▽＾)</span><span>(¬‿¬)</span><span>🌿</span>
        <span>(⊙_⊙)</span><span>🍫</span><span>(｡◕‿◕｡)</span>
    </div>

    <div class="grid">
        <div class="card">
            <div class="title">GACHA STUDIO</div>
            <div class="card-emoji-pic">🎰</div>
            <a href="gacha.html" class="btn">PLAY</a>
        </div>
        <div class="card">
            <div class="title">CATERPILLAR</div>
            <div class="card-emoji-pic">🐛</div>
            <a href="caterpillar.html" class="btn">PLAY</a>
        </div>
        <div class="card">
            <div class="title">MINT CHOCO ZONE</div>
            <div class="card-emoji-pic">🍫🌿</div>
            <a href="mint-choco.html" class="btn">ENTER</a>
        </div>
        <div class="card">
            <div class="title">PC COMPUTER GAME</div>
            <div class="card-emoji-pic">💻🐱</div>
            <a href="trust-cat.html" class="btn">PLAY</a>
        </div>
        <div class="card">
            <div class="title">CLICKER GAME</div>
            <div class="card-emoji-pic">🖱️✨</div>
            <a href="clicker.html" class="btn">PLAY</a>
        </div>
    </div>

</body>
</html>
