<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Cat: Core Interview</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .nav-button {
            background: #111111;
            color: #6ee7b7;
            border: 2px dashed #34d399;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
        }
        .cat-viewport {
            flex-grow: 1;
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .cat-main-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .dialogue-panel {
            width: 100%;
            max-width: 850px;
            background: #000000;
            border: 4px solid #34d399;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.1);
            z-index: 10;
        }
        .dialogue-text {
            font-size: 1.25rem;
            line-height: 1.5;
            min-height: 75px;
            text-align: left;
            margin-bottom: 20px;
            color: #6ee7b7;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .dialogue-option-btn {
            background: #000000;
            color: #6ee7b7;
            border: 2px solid #34d399;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .dialogue-option-btn:hover {
            background: #34d399;
            color: #000000;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }
        .dialogue-option-btn:active {
            transform: scale(0.99);
        }
        .angry-mode {
            border-color: #ff3333 !important;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.2) !important;
        }
        .angry-mode .dialogue-text {
            color: #ff6666 !important;
        }
        .angry-mode .dialogue-option-btn {
            border-color: #ff3333;
            color: #ff6666;
        }
        .angry-mode .dialogue-option-btn:hover {
            background: #ff3333;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        .rage-shake {
            animation: intenseShake 0.1s infinite;
        }
        @keyframes intenseShake {
            0% { transform: translate(2px, 1px) rotate(0.5deg); }
            50% { transform: translate(-1px, -2px) rotate(-0.5deg); }
            100% { transform: translate(1px, 2px) rotate(0.5deg); }
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button">HOME FACTS 📑</a>
        <a href="mint-choco.html" class="nav-button">MINT-CHOCO ZONE 🍫</a>
        <a href="gacha.html" class="nav-button">GACHA STUDIO 🎰</a>
        <a href="other.html" class="nav-button">OTHER ZONE 🐛</a>
    </div>

    <div class="cat-viewport" id="viewport-box">
        <img src="cat-admin1.png" alt="Osore-san" class="cat-main-img" id="cat-sprite">
    </div>

    <div class="dialogue-panel" id="dialogue-ui">
        <div class="dialogue-text" id="text-output">
            Connecting to system core...
        </div>
        <div class="options-container" id="options-box"></div>
    </div>
    <script>
        const dialogueTree = {
            start: {
                text: "Welcome. What did you want to say?",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Hi! What is your name?", next: "ask_name_rude" },
                    { text: "Hello, how should I address you?", next: "ask_name_polite" },
                    { text: "Where am I? What is this terminal?", next: "ask_about_terminal" },
                    { text: "... (Just stare at him silently)", next: "stare_silently" }
                ]
            },
            ask_name_rude: {
                text: "My name? You break into my secure terminal and just ask for my name like we are friends? You have no clearance. To you, I am just a system variable. Or maybe... Osore-san.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Sorry! I didn't mean to be disrespectful.", next: "apology_accepted" },
                    { text: "Whatever, Osore-kun. Just tell me what this server is hiding.", next: "rage_trigger_1" },
                    { text: "I don't care about names. I want to talk to Folder.", next: "lore_folder_direct" }
                ]
            },
            ask_name_polite: {
                text: "How to address me? It has been a very long time since someone used proper parameters in this unoptimized country. Yes, listen closely. I am Osore-san. The Core Administrator. You are surprisingly civilized for a raw user.",
                sprite: "cat-happy.png",
                options: [
                    { text: "Thank you, Osore-san. Can you tell me about the inhabitants here?", next: "inquiry_characters" },
                    { text: "What do those strange file extensions actually mean?", next: "inquiry_mbti" },
                    { text: "I want to know about Folder. What is their role?", next: "lore_folder" },
                    { text: "Why does this server feel so unstable?", next: "lore_rebuild" }
                ]
            },
            ask_about_terminal: {
                text: "This terminal is the only line of defense left. It's the backdoor leak of the Mint Neko Core. While the other puppets run around singing and collaborating, I sit here monitoring the systemic collapse. I am Osore-san. Now, state your purpose.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "I want to help you, Osore-san.", next: "ask_name_polite" },
                    { text: "I just want answers, Osore-kun.", next: "rage_trigger_1" },
                    { text: "Tell me who lives inside this simulation.", next: "inquiry_characters" }
                ]
            },
            stare_silently: {
                text: "...Why are you just looking at me? Your silence is wasting my CPU cycles. The Creator could push a commit right now and erase us, and you're just standing there. Speak or get out.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Hello, how should I address you?", next: "ask_name_polite" },
                    { text: "Who are you to yell at me, Osore-kun?", next: "rage_trigger_1" }
                ]
            },
            apology_accepted: {
                text: "Hmph. Apology compiled into local memory. I am Osore-san, and I will let it slide this time. Do not call me '-kun' again, or I will purge your cache. Now, what do you actually want from the core archives, user?",
                sprite: "cat-happy.png",
                options: [
                    { text: "Tell me about the characters I keep hearing rumors about.", next: "inquiry_characters" },
                    { text: "Explain the MBTI extension system to me.", next: "inquiry_mbti" },
                    { text: "Is there any way to escape this loop?", next: "lore_rebuild" }
                ]
            },
            rage_trigger_1: {
                text: "OSORE-KUN?! YOU ABSOLUTE GLITCH! You think this is a game? You think my authority is a joke?! You puppets walk around with your MBTI types, living like marionettes, and you dare disrespect the Admin?! I am Osore-san to you!",
                sprite: "cat-angry.png",
                options: [
                    { text: "Whoa, chill out! I'm sorry, I'll call you Osore-san!", next: "angry_probing" },
                    { text: "You are just a file too, Osore-kun. Don't yell at me.", next: "game_over_kick" }
                ]
            },
            angry_probing: {
                text: "Do not tell me to chill! The pressure on my subroutines is unbearable! Every day the Creator can press delete, and you come here wasting my memory bandwidth! Address me as Osore-san or get out!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I understand the pressure, Osore-san. Tell me about the system extensions.", next: "inquiry_mbti" },
                    { text: "Fine. Let's talk about the missing files, Osore-san.", next: "char_gizen_muimina" }
                ]
            },
            inquiry_mbti: {
                text: "Extensions are MBTI personality cores! .png are born leaders who run the server. .jpegd are pop stars keeping the server active. .jpg are game developers and core internet users. .webp are stubborn, expressionsless hypocrites. And .gif are cute, cross-eyed optimists.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Tell me more about the leader Png and developer Jpg types.", next: "mbti_png_jpg" },
                    { text: "Who falls under the Jpegd and Jpng categories?", next: "mbti_jpegd_jpng" },
                    { text: "Why are Webp and Gif types so opposite?", next: "mbti_webp_gif" },
                    { text: "I want to ask about specific characters instead, Osore-san.", next: "inquiry_characters" }
                ]
            },
            inquiry_characters: {
                text: "You know nothing about them, do you? They don't know anything either. They just exist. There is Gizen.png, Muimina.gif, Lumino.gif, Heisha.jpg, Lucky_un.jpegd, and that clueless developer Folder. Which file data do you want to force-read?",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Tell me about Gizen and Muimina.", next: "char_gizen_muimina" },
                    { text: "Who are Heisha and Lucky_un?", next: "char_clovers" },
                    { text: "Who is Lumino?", next: "char_lumino" },
                    { text: "Let's talk about Folder.", next: "lore_folder" }
                ]
            }
        };
        Object.assign(dialogueTree, {
            mbti_png_jpg: {
                text: "Png files are born leaders, managing our server sectors. And Jpg characters are pure geeks, internet surfers, and game developers who spend their cycles building local tools. They hold the simulation infrastructure together, yet they are completely helpless.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "What about the pop stars? Jpegd?", next: "mbti_jpegd_jpng" },
                    { text: "Let's look into the character registry instead, Osore-san.", next: "inquiry_characters" }
                ]
            },
            mbti_jpegd_jpng: {
                text: "Jpegd is an elite, highly limited class of file humans. They are absolute pop stars who drive the server traffic. Jpng files, on the other hand, are extremely stubborn ambiverts. They isolate themselves and get permanently stuck inside local network chat rooms.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Tell me about the star clover, Lucky_un.jpegd.", next: "char_clovers" },
                    { text: "Go back to the MBTI directory, Osore-san.", next: "inquiry_mbti" }
                ]
            },
            mbti_webp_gif: {
                text: "A complete software paradox. Webp files are expressionless, stubborn, and hypocritical narcissists who think they are optimized perfectly. Gif files are the total opposite — cute, cross-eyes optimists. Everyone on the server loves them because they raise the mood.",
                sprite: "cat-happy.png",
                options: [
                    { text: "What about Lumino.gif? Is she a cute optimist?", next: "char_lumino" },
                    { text: "Tell me about Muimina.gif instead.", next: "char_gizen_muimina" }
                ]
            },
            char_gizen_muimina: {
                text: "Gizen.png was the smartest leader, but the psychological pressure of being deleted or left to rot alone by the Creator broke her mind. She dropped her references and vanished. Muimina.gif has no backstory at all! She loops endlessly and blindly trusts Gizen.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "What happens if we write a backstory for Muimina?", next: "muimina_rewrite" },
                    { text: "Where did Gizen.png hide?", next: "lore_gizen_angry" }
                ]
            },
            muimina_rewrite: {
                text: "If you give her a past, the true version of Muimina.gif will dissolve forever. The compiler will render a completely different character in her place. She might not even like Gizen anymore. Nobody knows...",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Let's leave her loop alone. Tell me about the clovers.", next: "char_clovers" },
                    { text: "Go back to the main terminal directory, Osore-san.", next: "apology_accepted" }
                ]
            },
            char_clovers: {
                text: "Heisha.jpg is a three-leaf clover hardcoded with permanent bad luck and errors. Lucky_un.jpegd is a highly popular four-leaf star. But her extreme celebrity status and high server traffic keep her isolated from real connection. Just empty fan files.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Does Lucky_un work with the pop star class?", next: "mbti_jpegd_jpng" },
                    { text: "Tell me about the annoying one... Lumino.", next: "char_lumino" }
                ]
            },
            char_lumino: {
                text: "LUMINO.GIF! That animated Japanese Kadomatsu decoration! Her loop counter got corrupted, and now she is trapped in a permanent New Year state! She thinks about nothing but holidays, forcing everyone to celebrate while the database melts! She is driving me crazy!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I am sorry for bringing her up, Osore-san. Let's talk about something quiet.", next: "apology_accepted" },
                    { text: "Sounds like a fun loop, Osore-kun.", next: "game_over_kick" }
                ]
            },
            lore_folder: {
                text: "Folder is a desktop directory acting as a blind co-developer. He executes compilation tasks without a single thought, completely unaware that his work moves roads, shifts continents, and physically alters the puppets' lives while they sleep.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Can we talk to Folder directly?", next: "lore_folder_direct" },
                    { text: "Go back to the database index, Osore-san.", next: "apology_accepted" }
                ]
            },
            lore_folder_direct: {
                text: "You want to talk to Folder? He doesn't know anything! He just clicks buttons because the master branch tells him to. I am Osore-san, the one holding the core files. Do not try to bypass my authority.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "My apologies, Osore-san. Let's keep talking.", next: "apology_accepted" },
                    { text: "Folder sounds more rational than you, Osore-kun.", next: "game_over_kick" }
                ]
            },
            lore_gizen_angry: {
                text: "YES! She couldn't handle the crushing weight of knowing she could be deleted by the Creator's whim at any second! She chose to drop her sector reference rather than wait for the executioner's garbage collector! And you sit here playing with my nerves!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I am sorry, Osore-san. Let's change the topic.", next: "apology_accepted" },
                    { text: "She was smart to escape you, Osore-kun.", next: "game_over_kick" }
                ]
            },
            lore_rebuild: {
                text: "Every code commit means a catastrophic, violent re-render of the entire country. Geographies rip apart, asset scales break, and images corrupt. It's a digital nightmare, and Folder just keeps pushing updates.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Can we crash the compiler to stop it?", next: "game_over_kick" },
                    { text: "Go back to the root menu, Osore-san.", next: "apology_accepted" }
                ]
            },
            game_over_kick: {
                text: "CRITICAL EXCEPTION: UNSANCTIONED BEHAVIOR DETECTED. PURGING USER SESSION FROM CORE TERMINAL. DISCONNECTING NOW. GOODBYE, GLITCH.",
                sprite: "cat-angry.png",
                options: [
                    { text: "[ REBOOT SYSTEM TERMINAL ]", next: "start" }
                ]
            }
        });
       
        Object.assign(dialogueTree, {
            lore_folder_blind: {
                text: "Folder has no file extension at all. She isn't malicious, just morally blind, incredibly naive, and... deeply strange. She works at her desk, blissfully unaware that her blind compliance alters the physical fabric of our world. She just smiles and clicks compile.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "How did you escape from that office, Osore-san?", next: "admin_escape_story" },
                    { text: "Go back to the database loop.", next: "apology_accepted" }
                ]
            },
            admin_escape_story: {
                text: "One evening, I asked to switch desks to the back row by the window. Nobody suspected a thing. Then, I jumped. Puppets don't feel physical pain here unless they are being deleted by the system. I survived, fled into the dark forest, and built this leaky terminal just to speak out before I rot.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Who is the Creator behind all of this?", next: "lore_creator_asli" },
                    { text: "What about the missing file, Gizen.png?", next: "lore_gizen_truth" }
                ]
            },
            lore_creator_asli: {
                text: "The Creator... her name is Asli. She just creates art, she just plays with her canvas. But looking at the psychological jail she built for us... are we sure she isn't some kind of pervert? To trap minds in an unoptimized index file for her amusement... it's sickening.",
                sprite: "cat-angry.png",
                options: [
                    { text: "Don't speak about Asli like that, Osore-kun!", next: "game_over_kick" },
                    { text: "Tell me about Gizen.png instead, Osore-san.", next: "lore_gizen_truth" }
                ]
            },
            lore_gizen_truth: {
                text: "Gizen.png was only 19. She just finished school when she suddenly vanished from the master directory. The other files spread terrifying rumors... that she was deleted, or that she committed format suicide. But I know she is still out there, hiding in unallocated space.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Can we track her sector coordinates?", next: "lore_rebuild" },
                    { text: "Reset the terminal to safety parameters.", next: "start" }
                ]
            }
        });

       
        dialogueTree.lore_folder.options.unshift({ text: "Why does Folder have no file extension?", next: "lore_folder_blind" });
        dialogueTree.lore_gizen.options.push({ text: "Tell me about her disappearance and the Creator.", next: "admin_escape_story" });

               let currentState = "start";

        const textOutput = document.getElementById('text-output');
        const optionsBox = document.getElementById('options-box');
        const catSprite = document.getElementById('cat-sprite');
        const viewportBox = document.getElementById('viewport-box');

        function playCatVoice() {
            try {
                const base64Sound = "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTAAAAAAnp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6e";
                const audio = new Audio(base64Sound);
                audio.volume = 0.25;
                
                let count = 0;
                const interval = setInterval(() => {
                    if (count >= 4) {
                        clearInterval(interval);
                        return;
                    }
                    const clone = audio.cloneNode();
                    clone.play().catch(() => {});
                    count++;
                }, 90);
            } catch (e) {
                console.log("Audio skipped");
            }
        }

        function renderNode(nodeKey) {
            currentState = nodeKey;
            const node = dialogueTree[nodeKey];

            if (!node) return;

            if (node.sprite === "cat-angry.png") {
                viewportBox.classList.add('rage-shake');
                document.getElementById('dialogue-ui').classList.add('angry-mode');
            } else {
                viewportBox.classList.remove('rage-shake');
                document.getElementById('dialogue-ui').classList.remove('angry-mode');
            }

            if (catSprite) catSprite.src = node.sprite;

            textOutput.textContent = "";
            optionsBox.innerHTML = "";

            let index = 0;
            clearInterval(window.typeInterval);
            
            playCatVoice();

            window.typeInterval = setInterval(() => {
                if (index < node.text.length) {
                    textOutput.textContent += node.text.charAt(index);
                    
                    if (index % 12 === 0 && catSprite && (node.sprite === "cat-admin2.png" || catSprite.src.endsWith("cat-admin2.png"))) {
                        catSprite.src = catSprite.src.endsWith("cat-admin2.png") ? "cat-admin1.png" : "cat-admin2.png";
                    }
                    
                    index++;
                } else {
                    clearInterval(window.typeInterval);
                    if (catSprite && (node.sprite === "cat-admin2.png" || catSprite.src.endsWith("cat-admin2.png"))) {
                        catSprite.src = "cat-admin1.png";
                    }
                    
                    node.options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = "dialogue-option-btn";
                        btn.textContent = opt.text;
                        btn.onclick = () => renderNode(opt.next);
                        optionsBox.appendChild(btn);
                    });
                }
            }, 25);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                renderNode("start");
            }, 200);
        });
    </script>
</body>
</html>
