<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Cat: Core Interview</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .nav-button {
            background: #111111;
            color: #6ee7b7;
            border: 2px dashed #34d399;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
        }
        .cat-viewport {
            flex-grow: 1;
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .cat-main-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .dialogue-panel {
            width: 100%;
            max-width: 850px;
            background: #000000;
            border: 4px solid #34d399;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.1);
            z-index: 10;
        }
        .dialogue-text {
            font-size: 1.25rem;
            line-height: 1.5;
            min-height: 75px;
            text-align: left;
            margin-bottom: 20px;
            color: #6ee7b7;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .dialogue-option-btn {
            background: #000000;
            color: #6ee7b7;
            border: 2px solid #34d399;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .dialogue-option-btn:hover {
            background: #34d399;
            color: #000000;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }
        .dialogue-option-btn:active {
            transform: scale(0.99);
        }
        .rage-shake {
            animation: intenseShake 0.1s infinite;
        }
        @keyframes intenseShake {
            0% { transform: translate(2px, 1px) rotate(0.5deg); }
            50% { transform: translate(-1px, -2px) rotate(-0.5deg); }
            100% { transform: translate(1px, 2px) rotate(0.5deg); }
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button">HOME 📑</a>
        <a href="other.html" class="nav-button">OTHER ZONE 🐛</a>
    </div>

    <div class="cat-viewport" id="viewport-box">
        <img src="cat-admin1.png" alt="Osore" class="cat-main-img" id="cat-sprite">
    </div>

    <div class="dialogue-panel" id="dialogue-ui">
        <div class="dialogue-text" id="text-output">
            Connecting to system core...
        </div>
        <div class="options-container" id="options-box"></div>
    </div>
    <script>
        const dialogueTree = {
            start: {
                text: "Welcome. What did you want to say?",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Hi! What is your name?", next: "ask_name_rude" },
                    { text: "Hello, how should I address you, Osore-san?", next: "ask_name_polite" }
                ]
            },
            ask_name_rude: {
                text: "My name? You break into my secure terminal and just ask for my name like we are friends? You have no clearance. To you, I am just a system variable. Or maybe... Osore-kun? Is that what you think?",
                sprite: "cat-admin1.png",
                options: [
                    { text: "Sorry, Osore-san! I didn't mean to be disrespectful.", next: "apology_accepted" },
                    { text: "Whatever, Osore-kun. Just tell me what this server is hiding.", next: "rage_trigger_1" }
                ]
            },
            ask_name_polite: {
                text: "Osore-san... It has been a very long time since someone used proper parameters in this unoptimized country. Yes, I am Osore. The Core Administrator. You are surprisingly civilized for a user.",
                sprite: "cat-happy.png",
                options: [
                    { text: "Thank you. Can you tell me about the file extensions?", next: "lore_extensions" },
                    { text: "I want to know about Folder. What is their role?", next: "lore_folder" }
                ]
            },
            apology_accepted: {
                text: "Hmph. Apology compiled into local memory. I will let it slide this time. Do not call me '-kun' again, or I will purge your cache. Now, what do you actually want from the core archives?",
                sprite: "cat-happy.png",
                options: [
                    { text: "Tell me about Gizen.png. Where did she go?", next: "lore_gizen" },
                    { text: "What is wrong with Lumino.gif? Why is she like that?", next: "lore_lumino" }
                ]
            },
            rage_trigger_1: {
                text: "OSORE-KUN?! YOU ABSOLUTE GLITCH! You think this is a game? You think my authority is a joke?! You puppets walk around with your .jpg and .png extensions, living like marionettes, and you dare disrespect the Admin?!",
                sprite: "cat-angry.png",
                options: [
                    { text: "Whoa, chill out! I'm sorry, I'll call you Osore-san!", next: "angry_probing" },
                    { text: "You are just a file too, Osore. Don't yell at me.", next: "game_over_kick" }
                ]
            },
            angry_probing: {
                text: "Do not tell me to chill! The pressure on my subroutines is unbearable! Every day the Creator can press delete, and you come here wasting my CPU cycles! Speak properly or get out!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I understand the pressure. Tell me about Folder's work.", next: "lore_folder_tense" },
                    { text: "Is that why Gizen.png ran away?", next: "lore_gizen_angry" }
                ]
            },
            lore_extensions: {
                text: "The extensions... yes. Muimina.gif, Heisha.jpg, Lucky_un.jpegd. They live their pathetic little lives, traveling, making pop-star collaborations, thinking they have free will. They don't know their surnames are just asset types in our compiler. It is tragic.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "What about Muimina.gif? Does she know?", next: "lore_muimina" },
                    { text: "What happens when new code is pushed?", next: "lore_rebuild" }
                ]
            },
            lore_folder: {
                text: "Folder? That useless directory on the desktop... He thinks he is a grand developer, blindly building code structures day and night. He doesn't even realize that every line he executes physically reshapes states, cities, and crushes lives. He works, but knows nothing.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "And Webp? What is her file role?", next: "lore_webp" },
                    { text: "Go back to the main questions.", next: "apology_accepted" }
                ]
            }
        };
      
        Object.assign(dialogueTree, {
            lore_gizen: {
                text: "Gizen.png... The only one who truly understood the simulation. She knew our surnames were extensions. The psychological pressure broke her mind. She is pretending to be normal just to protect others from total panic. Now she is completely gone from the registry.",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Can we find her if we talk to Muimina.gif?", next: "lore_muimina" },
                    { text: "What about the New Year loop of Lumino.gif?", next: "lore_lumino" }
                ]
            },
            lore_lumino: {
                text: "Lumino.gif is a total disaster! An animated Japanese Kadomatsu decoration whose loop counter got stuck permanently on January 1st! She only thinks about New Year, forcing everyone to celebrate while the server is collapsing! She drives me completely insane!",
                sprite: "cat-angry.png",
                options: [
                    { text: "Calm down, Osore-san. Let's talk about the file extensions instead.", next: "lore_extensions" },
                    { text: "Maybe she just wants to be happy like Gif?", next: "lore_gif_info" }
                ]
            },
            lore_muimina: {
                text: "Muimina.gif has no hardcoded backstory in the compiler. She loops endlessly and blindly trusts Gizen.png as the smartest file in existence. If we rewrite her code to give her a past, the true Muimina will dissolve forever and be replaced by a stranger.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "That is horrible. What about Webp?", next: "lore_webp" },
                    { text: "Let's return to the main database terminal.", next: "apology_accepted" }
                ]
            },
            lore_rebuild: {
                text: "When a new code commit is pushed, it means a total, violent restructuring of the country. Cities shift, coordinates compress, and images get corrupted. It is a digital cataclysm. And Folder just keeps clicking compile...",
                sprite: "cat-admin2.png",
                options: [
                    { text: "Is there any way to stop the compiler?", next: "game_over_kick" },
                    { text: "I need to ask about other files.", next: "apology_accepted" }
                ]
            },
            lore_webp: {
                text: "Webp is a hypocritical, expressionless, and closed-off egoist. She thinks she is perfectly optimized for the modern web, so she actively looks down on old format citizens like Heisha.jpg. I can't stand her attitude.",
                sprite: "cat-admin1.png",
                options: [
                    { text: "What about the Gif format characters?", next: "lore_gif_info" },
                    { text: "Go back to safety.", next: "apology_accepted" }
                ]
            },
            lore_gif_info: {
                text: "The Gif extension family are absolute sweethearts. They have simple drawn faces and cute cross-eyes. Everyone on the server loves and values them because they always raise the connection traffic and mood. Unlike Webp...",
                sprite: "cat-happy.png",
                options: [
                    { text: "I have more questions about Gizen.png.", next: "lore_gizen" },
                    { text: "Reset conversation to initial parameters.", next: "start" }
                ]
            },
            lore_folder_tense: {
                text: "Folder compiles without a single thought! He executes directives from the master branch, moving roads and deleting assets while characters are sleeping. He is an administrative nightmare, a blind puppet with too much access!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I apologize for asking, Osore-san. Let's change the topic.", next: "apology_accepted" },
                    { text: "You talk too much, Osore-kun.", next: "game_over_kick" }
                ]
            },
            lore_gizen_angry: {
                text: "YES! She couldn't handle the crushing weight of knowing she could be deleted by the Creator's whim at any second! She chose to drop her sector reference rather than wait for the executioner's garbage collector! And you sit here playing with my nerves!",
                sprite: "cat-angry.png",
                options: [
                    { text: "I am sorry for making you remember this, Osore-san.", next: "apology_accepted" },
                    { text: "She was smart to escape you, Osore-kun.", next: "game_over_kick" }
                ]
            },
            game_over_kick: {
                text: "CRITICAL EXCEPTION: UNSANCTIONED BEHAVIOR DETECTED. PURGING USER SESSION FROM CORE TERMINAL. DISCONNECTING NOW. GOODBYE, GLITCH.",
                sprite: "cat-angry.png",
                options: [
                    { text: "[ REBOOT SYSTEM TERMINAL ]", next: "start" }
                ]
            }
        });

        let currentState = "start";

        const textOutput = document.getElementById('text-output');
        const optionsBox = document.getElementById('options-box');
        const catSprite = document.getElementById('cat-sprite');
        const viewportBox = document.getElementById('viewport-box');

        function playCatVoice() {
            try {
                const base64Sound = "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTAAAAAAnp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6e";
                const audio = new Audio(base64Sound);
                audio.volume = 0.25;
                
                let count = 0;
                const interval = setInterval(() => {
                    if (count >= 4) {
                        clearInterval(interval);
                        return;
                    }
                    const clone = audio.cloneNode();
                    clone.play().catch(() => {});
                    count++;
                }, 90);
            } catch (e) {
                console.log("Audio skipped");
            }
        }

        function renderNode(nodeKey) {
            currentState = nodeKey;
            const node = dialogueTree[nodeKey];

            if (!node) return;

            if (node.sprite === "cat-angry.png") {
                viewportBox.classList.add('rage-shake');
                document.getElementById('dialogue-ui').classList.add('angry-mode');
            } else {
                viewportBox.classList.remove('rage-shake');
                document.getElementById('dialogue-ui').classList.remove('angry-mode');
            }

            catSprite.src = node.sprite;

            textOutput.textContent = "";
            optionsBox.innerHTML = "";

            let index = 0;
            clearInterval(window.typeInterval);
            
            playCatVoice();

            window.typeInterval = setInterval(() => {
                if (index < node.text.length) {
                    textOutput.textContent += node.text.charAt(index);
                    
                    if (index % 12 === 0 && node.sprite === "cat-admin2.png") {
                        catSprite.src = catSprite.src.endsWith("cat-admin2.png") ? "cat-admin1.png" : "cat-admin2.png";
                    }
                    
                    index++;
                } else {
                    clearInterval(window.typeInterval);
                    if (node.sprite === "cat-admin2.png" || catSprite.src.endsWith("cat-admin2.png")) {
                        catSprite.src = "cat-admin1.png";
                    }
                    
                    node.options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = "dialogue-option-btn";
                        btn.textContent = opt.text;
                        btn.onclick = () => renderNode(opt.next);
                        optionsBox.appendChild(btn);
                    });
                }
            }, 25);
        }

        renderNode("start");
    </script>
</body>
</html>
