    @keyframes glitchAnim {

        50% { transform: skew(-2deg); filter: invert(0.1); }

    }
    @keyframes intenseShake {

        20% { transform: translate(-3px, 3px) rotate(-1deg); }
        40% { transform: translate(-4px, -1px) rotate(0deg); }
        60% { transform: translate(3px, 4px) rotate(2deg); }
        80% { transform: translate(-2px, -3px) rotate(-2deg); }
        100% { transform: translate(4px, 2px) rotate(1deg); }

<script>
    (function() {
        const textOutput = document.getElementById("text-output");
        const optionsBox = document.getElementById("options-box");
        const catSprite = document.getElementById("cat-sprite");
        const dialogueUi = document.getElementById("dialogue-ui");
        const viewportBox = document.getElementById("viewport-box");

        let currentTypingTimeout = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function triggerFileDownload() {
            const content = "WARNING: CORE RESTORATION ATTEMPTED.\nFILE 'MM1' INTERRUPTED.\nREASON: TERMINAL OVERHEAT.\nADMINISTRATOR SIGNATURE: OSORE-SAN.";
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "MM1.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function typeText(text, index, callback) {
            if (index < text.length) {
                textOutput.textContent += text[index];
                if (text[index] !== ' ' && index % 2 === 0) {
                    playBeep();
                }
                currentTypingTimeout = setTimeout(() => {
                    typeText(text, index + 1, callback);
                }, 20);
            } else {
                if (callback) callback();
            }
        }

        function renderNode(nodeKey) {
            initAudio();
            if (currentTypingTimeout) {
                clearTimeout(currentTypingTimeout);
            }

            const node = window.dialogueTree[nodeKey];
            if (!node) return;

            textOutput.textContent = "";
            optionsBox.innerHTML = "";
            catSprite.src = node.sprite;

            if (node.isAngry) {
                dialogueUi.classList.add("angry-mode");
                viewportBox.classList.add("rage-shake");
                dialogueUi.classList.add("rage-shake");
            } else {
                dialogueUi.classList.remove("angry-mode");
                viewportBox.classList.remove("rage-shake");
                dialogueUi.classList.remove("rage-shake");
            }

            if (node.isGlitch) {
                catSprite.classList.add("glitch-active");
                triggerFileDownload();
            } else {
                catSprite.classList.remove("glitch-active");
            }

            node.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "dialogue-option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => renderNode(opt.next);
                optionsBox.appendChild(btn);
            });

            typeText(node.text, 0, null);
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('click', () => {
                if (window.dialogueTree && window.dialogueTree.start && textOutput.textContent.includes("Click anywhere")) {
                    renderNode("start");
                }
            }, { once: true });
        });
    })();
</script>
