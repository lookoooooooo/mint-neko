<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko Hardcore Clicker v2</title>
    <style>
        * {
            cursor: url('cursor2.png') 16 16, auto !important;
        }
        body {
            background-color: #a7f3d0;
            color: #2b1810;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .nav-button {
            background: #2b1810;
            color: #34d399;
            border: 3px solid #1f110a;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #2b1810;
            text-shadow: 3px 3px #6ee7b7;
            font-size: 3.5rem;
        }
        .game-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px auto;
            min-height: 220px;
        }
        .helper-display-img {
            width: 130px;
            height: 180px;
            object-fit: contain;
            display: none;
            animation: bounceHelper 1s infinite alternate ease-in-out;
        }
        @keyframes bounceHelper {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        #stats-panel {
            font-size: 1.8rem;
            margin: 25px 0;
            color: #2b1810;
            font-weight: bold;
            text-shadow: 1px 1px #6ee7b7;
        }
        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.2rem;
            color: #047857;
            margin-top: 10px;
        }
        .shop-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border: 4px solid #2b1810;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(43, 24, 16, 0.1);
        }
        .shop-title {
            font-size: 2rem;
            color: #2b1810;
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 3px double #2b1810;
            padding-bottom: 10px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0fdf4;
            border: 2px dashed #2b1810;
            padding: 20px;
            border-radius: 16px;
            min-height: 100px;
        }
        .item-info {
            text-align: left;
            max-width: 60%;
        }
        .item-name {
            font-size: 1.2rem;
            color: #2b1810;
            font-weight: bold;
        }
        .item-desc {
            font-size: 0.95rem;
            color: #047857;
            margin-top: 4px;
            line-height: 1.3;
        }
        .shop-btn {
            background: #34d399;
            color: #2b1810;
            border: 2px solid #2b1810;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px #1f110a;
            white-space: nowrap;
        }
        .shop-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #1f110a;
        }
        .shop-btn:disabled {
            background: #cbd5e1;
            color: #64748b;
            border-color: #94a3b8;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button" onclick="return confirmLeave()">← HOME</a>
    </div>

    <h1>MINT NEKO CLICKER</h1>
    
    <div class="game-zone">
        <div style="position: relative; display: inline-block;">
            <img src="cat.gif" alt="Click Neko" id="click-cat" onclick="meowClick(event)" style="width: 200px; height: 200px; object-fit: contain;">
            <div id="paw-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
        </div>
       
        <img src="helper.png" alt="Neko Assistant" id="helper-graphic" class="helper-display-img">
    </div>
    
    <div id="stats-panel">
        <div>Mint Coins: <span id="coins-display">0</span> 🐾</div>
        <div class="stats-grid">
            <div>Click Power: +<span id="click-display">1</span></div>
            <div>Autoclick Power: +<span id="cps-display">0</span>/sec</div>
        </div>
    </div>
    <div class="shop-container">
        <div class="shop-title">Minty Upgrade Shop</div>
        <div class="shop-grid">
            
           
            <div class="shop-item" id="shop-box-helper">
                <div class="item-info">
                    <div class="item-name" id="helper-name">Japanese Assistant 👩‍💼</div>
                    <div class="item-desc" id="helper-desc">Hire an assistant to help you get +30 CPS. One-time hire!</div>
                </div>
                <button class="shop-btn" id="btn-helper" onclick="upgradeHelper()">Cost: 500</button>
            </div>

           
            <div class="shop-item" id="shop-box-click">
                <div class="item-info">
                    <div class="item-name" id="click-name">Fresh Mint Leaf 🌿</div>
                    <div class="item-desc" id="click-desc">Slightly boosts your clicks to +10 per click.</div>
                </div>
                <button class="shop-btn" id="btn-click" onclick="upgradeClick()">Cost: 15</button>
            </div>

        </div>
    </div>
    <script>
        let coins = 0;
        let currentHelperLevel = 0;
        let currentClickLevel = 0;

        const helperUpgrades = [
            { level: 1, name: "Japanese Assistant 👩‍💼", cost: 500, cps: 30, file: "helper.png", desc: "Hire an assistant to get +30 CPS." },
            { level: 2, name: "Japanese Salaryman 👨‍💼", cost: 2500, cps: 150, file: "helper2.png", desc: "Upgrade to a businessman for +150 CPS!" },
            { level: 3, name: "Tokyo Business Boss 👔", cost: 12000, cps: 600, file: "helper3.png", desc: "Promote to an executive for +600 CPS!" },
            { level: 4, name: "Robo-Secretary 9000 🤖", cost: 50000, cps: 2500, file: "helper4.png", desc: "Upgrade to a cyber worker for +2500 CPS!" },
            { level: 5, name: "Mint Cyber-Samurai ⚔️", cost: 250000, cps: 12000, file: "helper5.png", desc: "Hire a digital guardian for +12000 CPS!" },
            { level: 6, name: "Mint Empire Emperor 👑", cost: 1000000, cps: 60000, file: "helper6.png", desc: "Max level! Ultimate tycoon provides +60000 CPS!" }
        ];

        const clickUpgrades = [
            { level: 1, name: "Fresh Mint Leaf 🌿", cost: 15, power: 10, desc: "Boosts your clicks to +10 per press." },
            { level: 2, name: "Wild Catnip Sprig 🌱", cost: 150, power: 60, desc: "Upgrades your clicks to +60 per press." },
            { level: 3, name: "Mint Chocolate Chip 🍫", cost: 800, power: 250, desc: "Upgrades your clicks to +250 per press." },
            { level: 4, name: "Sweet Neko Syrup 🍯", cost: 4000, power: 1100, desc: "Upgrades your clicks to +1100 per press." },
            { level: 5, name: "Quantum Mint Spice 🌌", cost: 20000, power: 5000, desc: "Upgrades your clicks to +5000 per press." },
            { level: 6, name: "Cosmic Catnip Essence ✨", cost: 100000, power: 25000, desc: "Max click! Blast off to +25000 per press!" }
        ];

        function getClickPower() {
            if (currentClickLevel === 0) return 1;
            return clickUpgrades[currentClickLevel - 1].power;
        }

        function getCpsPower() {
            if (currentHelperLevel === 0) return 0;
            return helperUpgrades[currentHelperLevel - 1].cps;
        }
        function updateUI() {
            document.getElementById('coins-display').innerText = Math.floor(coins);
            document.getElementById('click-display').innerText = getClickPower();
            document.getElementById('cps-display').innerText = getCpsPower();

            if (currentHelperLevel < helperUpgrades.length) {
                let up = helperUpgrades[currentHelperLevel];
                document.getElementById('helper-name').innerText = up.name;
                document.getElementById('helper-desc').innerText = up.desc;
                document.getElementById('btn-helper').innerText = `Cost: ${up.cost}`;
                document.getElementById('btn-helper').disabled = coins < up.cost;
            } else {
                document.getElementById('helper-name').innerText = "Max Level Reached! 🌟";
                document.getElementById('helper-desc').innerText = "Your Japanese corporate empire is fully optimized.";
                document.getElementById('btn-helper').innerText = "SOLD OUT";
                document.getElementById('btn-helper').disabled = true;
            }

            if (currentClickLevel < clickUpgrades.length) {
                let up = clickUpgrades[currentClickLevel];
                document.getElementById('click-name').innerText = up.name;
                document.getElementById('click-desc').innerText = up.desc;
                document.getElementById('btn-click').innerText = `Cost: ${up.cost}`;
                document.getElementById('btn-click').disabled = coins < up.cost;
            } else {
                document.getElementById('click-name').innerText = "Max Level Reached! 🌟";
                document.getElementById('click-desc').innerText = "Your mouse clicks hold cosmic clicking powers.";
                document.getElementById('btn-click').innerText = "SOLD OUT";
                document.getElementById('btn-click').disabled = true;
            }

            let graphic = document.getElementById('helper-graphic');
            if (currentHelperLevel > 0) {
                graphic.src = helperUpgrades[currentHelperLevel - 1].file;
                graphic.style.display = 'block';
            } else {
                graphic.style.display = 'none';
            }
        }

        function meowClick(event) {
            let power = getClickPower();
            coins += power;
            updateUI();
            playAudio();

            const container = document.getElementById('paw-container');
            const p = document.createElement('div');
            p.innerText = `+${power} 🐾`;
            p.style.position = 'absolute';
            p.style.color = '#2b1810';
            p.style.fontWeight = 'bold';
            p.style.fontSize = '1.5rem';
            p.style.left = (event.offsetX - 20) + 'px';
            p.style.top = (event.offsetY - 20) + 'px';
            p.style.pointerEvents = 'none';
            p.style.transition = 'all 0.6s ease-out';
            
            container.appendChild(p);

            setTimeout(() => {
                p.style.transform = 'translateY(-60px)';
                p.style.opacity = '0';
            }, 10);

            setTimeout(() => p.remove(), 600);
        }

        function upgradeHelper() {
            if (currentHelperLevel < helperUpgrades.length) {
                let up = helperUpgrades[currentHelperLevel];
                if (coins >= up.cost) {
                    coins -= up.cost;
                    currentHelperLevel++;
                    updateUI();
                    playAudio();
                }
            }
        }

        function upgradeClick() {
            if (currentClickLevel < clickUpgrades.length) {
                let up = clickUpgrades[currentClickLevel];
                if (coins >= up.cost) {
                    coins -= up.cost;
                    currentClickLevel++;
                    updateUI();
                    playAudio();
                }
            }
        }

        function playAudio() {
            const audio = new Audio('https://mixkit.co');
            audio.play().catch(() => {});
        }

        setInterval(() => {
            let cps = getCpsPower();
            if (cps > 0) {
                coins += cps;
                updateUI();
            }
        }, 1000);

        function confirmLeave() {
            if (confirm("Are you sure you want to leave??")) {
                if (confirm("ARE YOU REALLY SURE?!")) {
                    if (confirm("ALL YOUR PURCHASES AND CLICKS WILL BE RESET!!!")) {
                        alert("DON'T BLAME ME, YOU WANTED THIS YOURSELF!");
                        return true;
                    }
                }
            }
            return false;
        }

        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '';
        };

        window.onload = updateUI;
    </script>
</body>
</html>
