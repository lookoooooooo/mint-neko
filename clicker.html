<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko RPG Clicker</title>
    <style>
        * {
            cursor: url('cursor2.png') 16 16, auto !important;
        }
        body {
            background-color: #a7f3d0;
            color: #2b1810;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .nav-button {
            background: #2b1810;
            color: #34d399;
            border: 3px solid #1f110a;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #2b1810;
            text-shadow: 3px 3px #6ee7b7;
            font-size: 3.5rem;
        }
        .game-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 20px auto;
        }
        .helpers-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 150px;
            max-width: 900px;
        }
        .helper-display-img {
            width: 90px;
            height: 140px;
            object-fit: contain;
            animation: bounceHelper 1s infinite alternate ease-in-out;
        }
        @keyframes bounceHelper {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        #stats-panel {
            font-size: 1.8rem;
            margin: 25px 0;
            color: #2b1810;
            font-weight: bold;
            text-shadow: 1px 1px #6ee7b7;
        }
        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.2rem;
            color: #047857;
            margin-top: 10px;
        }
        .shop-container {
            max-width: 850px;
            margin: 30px auto;
            background: #ffffff;
            border: 4px solid #2b1810;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(43, 24, 16, 0.1);
        }
        .shop-title {
            font-size: 2rem;
            color: #2b1810;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 3px double #2b1810;
            padding-bottom: 10px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0fdf4;
            border: 2px dashed #2b1810;
            padding: 15px;
            border-radius: 16px;
        }
        .item-info {
            text-align: left;
            max-width: 65%;
        }
        .item-name {
            font-size: 1.1rem;
            color: #2b1810;
            font-weight: bold;
        }
        .item-desc {
            font-size: 0.85rem;
            color: #047857;
            margin-top: 2px;
        }
        .shop-btn {
            background: #34d399;
            color: #2b1810;
            border: 2px solid #2b1810;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px #1f110a;
            white-space: nowrap;
        }
        .shop-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #1f110a;
        }
        .shop-btn:disabled {
            background: #cbd5e1;
            color: #64748b;
            border-color: #94a3b8;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button" onclick="return confirmLeave()">← HOME</a>
    </div>

    <h1>MINT NEKO CLICKER</h1>
    
    <div class="game-zone">
        <div style="position: relative; display: inline-block;">
            <img src="cat.gif" alt="Click Neko" id="click-cat" onclick="meowClick(event)" style="width: 180px; height: 180px; object-fit: contain;">
            <div id="paw-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
        </div>
        <div class="helpers-container" id="helpers-box"></div>
    </div>
    
    <div id="stats-panel">
        <div>Mint Coins: <span id="coins-display">0</span> 🐾</div>
        <div class="stats-grid">
            <div>Click Power: +<span id="click-display">1</span></div>
            <div>Autoclick Power: +<span id="cps-display">0</span>/sec</div>
        </div>
    </div>

   
    <div class="shop-container">
        <div class="shop-title">🛍️ Dynamic Shop Showcase (Max 6 Items)</div>
        <div class="shop-grid" id="showcase-grid"></div>
    </div>

   
    <div class="shop-container">
        <div class="shop-title">🧪 Upgrades & Investments (Purchased)</div>
        <div class="shop-grid" id="upgrades-grid"></div>
    </div>
    <script>
        let coins = 0;
        let clickPower = 1;
        let cps = 0;

        const shopItems = [
            { id: 1, name: "Fresh Mint Leaf 🌿", type: "click", cost: 15, power: 2, purchased: false, state: "available", upgradeLevel: 1 },
            { id: 2, name: "Spearmint Shoot 🌱", type: "click", cost: 50, power: 5, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 3, name: "Peppermint Powder 🍃", type: "click", cost: 120, power: 10, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 4, name: "Wild Catnip Sprig 🌿", type: "click", cost: 250, power: 20, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 5, name: "Mint Tea Bag ☕", type: "click", cost: 500, power: 45, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 6, name: "Japanese Assistant 👩‍💼", type: "helper", cost: 500, cps: 30, file: "helper.png", purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 7, name: "Japanese Salaryman 👨‍💼", type: "helper", cost: 1200, cps: 80, file: "helper2.png", purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 8, name: "Mint Candy Cane 🍬", type: "click", cost: 1500, power: 90, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 9, name: "Sweet Mint Syrup 🍯", type: "click", cost: 3000, power: 180, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 10, name: "Spearmint Extract 🧪", type: "click", cost: 4000, power: 300, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 11, name: "Mint Ice Cream 🍦", type: "click", cost: 7000, power: 500, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 12, name: "Choco Coating 🍫", type: "click", cost: 10000, power: 800, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 13, name: "Chocolate Chip Chunk 🍫", type: "click", cost: 15000, power: 1200, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 14, name: "Double Mint Glaze 🍩", type: "click", cost: 22000, power: 1800, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 15, name: "Mint Soda Pop 🥤", type: "click", cost: 30000, power: 2500, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 16, name: "Choco Robo-Cat 🤖", type: "click", cost: 45000, power: 3800, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 17, name: "Double Choco Glaze 🍩", type: "click", cost: 60000, power: 5000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 18, name: "Mint Cookie Crust 🍪", type: "click", cost: 85000, power: 6500, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 19, name: "Cocoa Butter Sprinkles ✨", type: "click", cost: 120000, power: 8000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 20, name: "Choco Wafer Bar 🍫", type: "click", cost: 170000, power: 11000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 21, name: "Mint Macaron 🥮", type: "click", cost: 240000, power: 15000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 22, name: "Corporate Upgrade 🕴️", type: "click", cost: 350000, power: 22000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 23, name: "Pure Mint Extract 🧪", type: "click", cost: 500000, power: 35000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 24, name: "Financial Boost 📊", type: "click", cost: 750000, power: 50000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 25, name: "Choco Diamond Sugar 💎", type: "click", cost: 1100000, power: 75000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 26, name: "Mint Laser Pointer 🚨", type: "click", cost: 1600000, power: 110000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 27, name: "Cyber Coffee Pot ☕", type: "click", cost: 2300000, power: 160000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 28, name: "Neko Space Rocket 🚀", type: "click", cost: 3200000, power: 250000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 29, name: "Mint Crystal Cluster 🔮", type: "click", cost: 4500000, power: 400000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 30, name: "Quantum Mint Herb 🌌", type: "click", cost: 6500000, power: 650000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 31, name: "Cosmic Cocoa Bean ☄️", type: "click", cost: 9000000, power: 1000000, purchased: false, revealed: false },
            { id: 32, name: "Choco Neko Satellite 🛰️", type: "click", cost: 13000000, power: 1600000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 33, name: "Mint Solar Panel ☀️", type: "click", cost: 19000000, power: 2500000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 34, name: "Nebula Chocolate 🌌", type: "click", cost: 28000000, power: 4000000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 35, name: "Supernova Mint Spice 💥", type: "click", cost: 40000000, power: 6500000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 36, name: "Black Hole Cocoa 🕳️", type: "click", cost: 58000000, power: 10000000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 37, name: "Neko Quantum Core 🔮", type: "click", cost: 85000000, power: 16000000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 38, name: "Choco Galaxy Matrix 🌌", type: "click", cost: 125000000, power: 25000000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 39, name: "Mint Universe Engine 🌌", type: "click", cost: 185000000, power: 40000000, purchased: false, state: "locked", upgradeLevel: 1 },
            { id: 40, name: "Infinity Neko Crown 👑", type: "click", cost: 300000000, power: 70000000, purchased: false, state: "locked", upgradeLevel: 1 }
        ];

        for (let i = 0; i < 6; i++) {
            if (shopItems[i]) shopItems[i].state = "available";
        }

        function updateUI() {
            document.getElementById('coins-display').innerText = Math.floor(coins);
            document.getElementById('click-display').innerText = clickPower;
            document.getElementById('cps-display').innerText = cps;

            const showcaseGrid = document.getElementById('showcase-grid');
            showcaseGrid.innerHTML = '';

            let displayedCount = 0;
            for (let i = 0; i < shopItems.length; i++) {
                let item = shopItems[i];
                if (item.state === "available" && !item.purchased && displayedCount < 6) {
                    displayedCount++;
                    const box = document.createElement('div');
                    box.className = 'shop-item';
                    
                    const info = document.createElement('div');
                    info.className = 'item-info';
                    
                    const name = document.createElement('div');
                    name.className = 'item-name';
                    name.innerText = item.name;
                    
                    const desc = document.createElement('div');
                    desc.className = 'item-desc';
                    desc.innerText = item.type === 'click' ? `Click: +${item.power}` : `Adds +${item.cps} CPS`;
                    
                    info.appendChild(name);
                    info.appendChild(desc);

                    const btn = document.createElement('button');
                    btn.className = 'shop-btn';
                    btn.innerText = `Cost: ${item.cost}`;
                    btn.disabled = coins < item.cost;
                    btn.onclick = () => buyItem(item.id);

                    box.appendChild(info);
                    box.appendChild(btn);
                    showcaseGrid.appendChild(box);
                }
            }

            const upgradesGrid = document.getElementById('upgrades-grid');
            upgradesGrid.innerHTML = '';

            shopItems.forEach((item) => {
                if (item.purchased) {
                    const box = document.createElement('div');
                    box.className = 'shop-item';
                    
                    const info = document.createElement('div');
                    info.className = 'item-info';
                    
                    const name = document.createElement('div');
                    name.className = 'item-name';
                    name.innerText = `${item.name} (Lvl ${item.upgradeLevel})`;
                    
                    let currentBonus = item.type === 'click' ? item.power * item.upgradeLevel : item.cps * item.upgradeLevel;
                    const desc = document.createElement('div');
                    desc.className = 'item-desc';
                    desc.innerText = item.type === 'click' ? `Current Click: +${currentBonus}` : `Current CPS: +${currentBonus}`;
                    
                    info.appendChild(name);
                    info.appendChild(desc);

                    let upgradeCost = Math.floor(item.cost * 1.5 * Math.pow(1.3, item.upgradeLevel - 1));

                    const btn = document.createElement('button');
                    btn.className = 'shop-btn';
                    btn.innerText = `Upgrade: ${upgradeCost}`;
                    btn.disabled = coins < upgradeCost;
                    btn.onclick = () => upgradeItem(item.id, upgradeCost);

                    box.appendChild(info);
                    box.appendChild(btn);
                    upgradesGrid.appendChild(box);
                }
            });
        }
        function buyItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (item && coins >= item.cost && !item.purchased) {
                coins -= item.cost;
                item.purchased = true;

                if (item.type === 'click') {
                    clickPower += item.power;
                } else if (item.type === 'helper') {
                    cps += item.cps;
                    const helpersBox = document.getElementById('helpers-box');
                    const img = document.createElement('img');
                    img.src = item.file;
                    img.className = 'helper-display-img';
                    img.alt = item.name;
                    helpersBox.appendChild(img);
                }

                let currentAvailableCount = shopItems.filter(i => i.state === "available" && !i.purchased).length;
                if (currentAvailableCount < 6) {
                    for (let i = 0; i < shopItems.length; i++) {
                        if (shopItems[i].state === "locked") {
                            shopItems[i].state = "available";
                            break;
                        }
                    }
                }

                updateUI();
                playAudio();
            }
        }

        function upgradeItem(id, upgradeCost) {
            const item = shopItems.find(i => i.id === id);
            if (item && coins >= upgradeCost && item.purchased) {
                coins -= upgradeCost;
                item.upgradeLevel++;

                if (item.type === 'click') {
                    clickPower += item.power;
                } else if (item.type === 'helper') {
                    cps += item.cps;
                }

                updateUI();
                playAudio();
            }
        }

        function meowClick(event) {
            coins += clickPower;
            updateUI();
            playAudio();

            const container = document.getElementById('paw-container');
            const p = document.createElement('div');
            p.innerText = `+${clickPower} 🐾`;
            p.style.position = 'absolute';
            p.style.color = '#2b1810';
            p.style.fontWeight = 'bold';
            p.style.fontSize = '1.5rem';
            p.style.left = (event.offsetX - 20) + 'px';
            p.style.top = (event.offsetY - 20) + 'px';
            p.style.pointerEvents = 'none';
            p.style.transition = 'all 0.6s ease-out';
            
            container.appendChild(p);

            setTimeout(() => {
                p.style.transform = 'translateY(-60px)';
                p.style.opacity = '0';
            }, 10);

            setTimeout(() => p.remove(), 600);
        }

        function playAudio() {
            const audio = new Audio('https://mixkit.co');
            audio.play().catch(() => {});
        }

        setInterval(() => {
            if (cps > 0) {
                coins += cps;
                updateUI();
            }
        }, 1000);

        function confirmLeave() {
            if (confirm("Are you sure you want to leave??")) {
                if (confirm("ARE YOU REALLY SURE?!")) {
                    if (confirm("ALL YOUR PURCHASES AND CLICKS WILL BE RESET!!!")) {
                        alert("DON'T BLAME ME, YOU WANTED THIS YOURSELF!");
                        return true;
                    }
                }
            }
            return false;
        }

        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '';
        };

        window.onload = updateUI;
    </script>
</body>
</html>
