<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Gacha Studio</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
            box-sizing: border-box;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            text-align: center;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .nav-button {
            background: #4b2e1e;
            color: #6ee7b7;
            border: 2px dashed #34d399;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }
        .game-layout {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .game-layout { grid-template-columns: 1.2fr 1fr; }
        }
        .main-machine-panel {
            background: #2b1810;
            border: 5px solid #34d399;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .machine-header {
            width: 100%;
            background: #150b06;
            border: 3px inset #34d399;
            border-radius: 12px;
            padding: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .screen-container {
            width: 100%;
            height: 240px;
            background: #000;
            border: 4px inset #6ee7b7;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .screen-content {
            font-size: 5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .screen-content img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .color-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: inset -10px -10px 15px rgba(0,0,0,0.4);
        }
        .selector-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            gap: 15px;
        }
        .arrow-btn {
            background: #4b2e1e;
            color: #34d399;
            border: 3px solid #34d399;
            font-size: 1.8rem;
            font-weight: bold;
            width: 60px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
        }
        .arrow-btn:active { transform: scale(0.95); }
        .machine-info {
            flex-grow: 1;
            background: #150b06;
            border: 2px dashed #6ee7b7;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
        }
        .crank-btn {
            background: #fbbf24;
            color: #1f110a;
            border: 4px solid #fff;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 6px #b45309;
            cursor: pointer;
        }
        .crank-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px #b45309;
        }
        .crank-btn:disabled {
            background: #4b2e1e;
            color: #1f110a;
            border-color: #3d2314;
            box-shadow: none;
            transform: none;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sub-box {
            background: #2b1810;
            border: 4px solid #34d399;
            border-radius: 20px;
            padding: 15px;
        }
        .sub-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fbbf24;
            border-bottom: 2px dashed #34d399;
            padding-bottom: 5px;
            margin-bottom: 12px;
        }
        .grid-display {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .inv-card {
            background: #150b06;
            border: 2px solid #3d2314;
            border-radius: 10px;
            padding: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95px;
        }
        .inv-card.active { border-color: #34d399; }
        .inv-card img { width: 50px; height: 50px; object-fit: contain; }
        .inv-sphere { width: 45px; height: 40px; border-radius: 50%; border: 2px solid #fff; }
        .inv-count {
            position: absolute;
            bottom: 2px; right: 4px;
            background: #4b2e1e;
            color: #6ee7b7;
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
        }
        .sell-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .inv-card:hover .sell-overlay { display: flex; }
        .sell-btn {
            background: #ff3333;
            color: #fff;
            border: 1px solid #fff;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        .wheel-container {
            background: #150b06;
            border: 3px inset #34d399;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .reset-corner-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: none; border: none;
            font-size: 1.2rem; cursor: pointer;
            opacity: 0.5; transition: opacity 0.2s;
        }
        .reset-corner-btn:hover { opacity: 1; }
        .shake-screen { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button">HOME FACTS 📑</a>
        <a href="mint-choco.html" class="nav-button">MINT-CHOCO ZONE 🍫</a>
        <a href="other.html" class="nav-button">OTHER ZONE 🐛</a>
    </div>

    <div class="game-layout">
        
        <div class="main-machine-panel">
            <button class="reset-corner-btn" onclick="triggerSystemWipe()">⚙️</button>
            
            <div class="machine-header">
                <span>🎰 GACHA CORE</span>
                <span style="color: #fbbf24;">💰 <span id="coin-display">0</span></span>
            </div>

            <div class="screen-container" id="screen-viewport">
                <div class="screen-content" id="screen-output">📦</div>
            </div>

            <div class="selector-row">
                <button class="arrow-btn" onclick="switchMachine(-1)">&lt;</button>
                <div class="machine-info">
                    <div id="mach-title" style="color: #fbbf24;">COMMON CAPSULE</div>
                    <div id="mach-cost" style="font-size: 0.9rem; color: #a7f3d0; margin-top: 4px;">Cost: 30 Coins</div>
                </div>
                <button class="arrow-btn" onclick="switchMachine(1)">&gt;</button>
            </div>

            <button class="crank-btn" id="crank-trigger" onclick="executeRoll()">TURN CRANK</button>
        </div>

        <div class="side-panel">
            <div class="sub-box">
                <div class="sub-title">🔮 Secret Wheel of Fortune</div>
                <div class="wheel-container">
                    <div style="text-align: left;">
                        <div id="wheel-timer" style="font-weight: bold; color: #a7f3d0;">Next Spin: Ready</div>
                        <div style="font-size: 0.75rem; color: #6ee7b7; margin-top: 2px;">Mystery box or huge cash drops</div>
                    </div>
                    <button class="action-btn" id="wheel-trigger" style="width: auto; padding: 8px 16px; margin: 0;" onclick="spinSecretWheel()">Spin Wheel</button>
                </div>
            </div>

            <div class="sub-box">
                <div class="sub-title">🎒 Vault Collection (<span id="collected-stat">0</span>/38)</div>
                <div class="grid-display" id="vault-inventory"></div>
            </div>
        </div>

    </div>
    <script>
        const megaCollection = [
            { id: 1, type: "img", file: "cat1.jpg", tag: "COMMON" },
            { id: 2, type: "img", file: "cat2.jpg", tag: "COMMON" },
            { id: 3, type: "img", file: "cat3.jpg", tag: "COMMON" },

            { id: 25, type: "color", val: "#99f6e4", tag: "COMMON" },
            { id: 26, type: "color", val: "#2dd4bf", tag: "RARE" },

            { id: 30, type: "color", val: "#451a03", tag: "LEGENDARY" },
            { id: 31, type: "color", val: "#1f110a", tag: "LEGENDARY" },

            { id: 33, type: "color", val: "#b45309", tag: "RARE" },

            { id: 36, type: "color", val: "#3e2723", tag: "RARE" },
            { id: 37, type: "color", val: "#d7ccc8", tag: "COMMON" },
            { id: 38, type: "color", val: "#5d4037", tag: "COMMON" },
            { id: 39, type: "emoji", val: "🐱", tag: "COMMON" }, { id: 40, type: "emoji", val: "🐈", tag: "COMMON" },
            { id: 41, type: "emoji", val: "🐯", tag: "RARE" }, { id: 42, type: "emoji", val: "🦁", tag: "RARE" },
            { id: 43, type: "emoji", val: "🐆", tag: "LEGENDARY" }, { id: 44, type: "emoji", val: "🦊", tag: "COMMON" },
            { id: 45, type: "emoji", val: "🦝", tag: "COMMON" }, { id: 46, type: "emoji", val: "🐰", tag: "COMMON" },
            { id: 47, type: "emoji", val: "🐻", tag: "COMMON" }, { id: 48, type: "emoji", val: "🐼", tag: "RARE" },
            { id: 49, type: "emoji", val: "🐨", tag: "RARE" }, { id: 50, type: "emoji", val: "🐵", tag: "COMMON" },
            { id: 51, type: "emoji", val: "🐸", tag: "COMMON" }, { id: 52, type: "emoji", val: "🐉", tag: "LEGENDARY" },
            { id: 53, type: "emoji", val: "🦕", tag: "LEGENDARY" }, { id: 54, type: "emoji", val: "🦖", tag: "LEGENDARY" },
            { id: 55, type: "emoji", val: "🐋", tag: "RARE" }, { id: 56, type: "emoji", val: "🦈", tag: "RARE" },
            { id: 57, type: "emoji", val: "🐙", tag: "COMMON" }, { id: 58, type: "emoji", val: "🐝", tag: "COMMON" },
            { id: 59, type: "emoji", val: "🦋", tag: "LEGENDARY" }, { id: 60, type: "emoji", val: "🐞", tag: "COMMON" },
            { id: 61, type: "emoji", val: "🍬", tag: "COMMON" }, { id: 62, type: "emoji", val: "🍭", tag: "COMMON" },
            { id: 63, type: "emoji", val: "🍫", tag: "COMMON" }, { id: 64, type: "emoji", val: "🍩", tag: "COMMON" },
            { id: 65, type: "emoji", val: "🍪", tag: "COMMON" }, { id: 66, type: "emoji", val: "🧁", tag: "COMMON" },
            { id: 71, type: "emoji", val: "💎", tag: "LEGENDARY" }, { id: 72, type: "emoji", val: "🔮", tag: "LEGENDARY" },
            { id: 73, type: "emoji", val: "👑", tag: "LEGENDARY" }, { id: 74, type: "emoji", val: "✨", tag: "COMMON" },
            { id: 75, type: "emoji", val: "🌟", tag: "COMMON" }, { id: 76, type: "emoji", val: "☄️", tag: "RARE" },
            { id: 77, type: "emoji", val: "🎨", tag: "RARE" }, { id: 78, type: "emoji", val: "🎭", tag: "RARE" },
            { id: 79, type: "emoji", val: "🎮", tag: "RARE" }, { id: 80, type: "emoji", val: "🎸", tag: "COMMON" },
            { id: 81, type: "emoji", val: "🎪", tag: "COMMON" }, { id: 82, type: "emoji", val: "🎟", tag: "COMMON" },
            { id: 83, type: "emoji", val: "🛸", tag: "LEGENDARY" }, { id: 84, type: "emoji", val: "🚀", tag: "LEGENDARY" },
            { id: 85, type: "emoji", val: "🌋", tag: "RARE" }, { id: 86, type: "emoji", val: "🪐", tag: "RARE" },
            { id: 87, type: "emoji", val: "🌅", tag: "COMMON" }, { id: 88, type: "emoji", val: "🌌", tag: "RARE" },
            { id: 89, type: "emoji", val: "🍀", tag: "COMMON" }, { id: 90, type: "emoji", val: "🌿", tag: "COMMON" },
            { id: 91, type: "emoji", val: "🍄", tag: "COMMON" }, { id: 92, type: "emoji", val: "🌵", tag: "COMMON" },
            { id: 93, type: "emoji", val: "🌸", tag: "COMMON" }, { id: 94, type: "emoji", val: "🌹", tag: "COMMON" },
            { id: 95, type: "emoji", val: "🌻", tag: "COMMON" }, { id: 96, type: "emoji", val: "🍁", tag: "COMMON" },
            { id: 97, type: "emoji", val: "🍇", tag: "COMMON" }, { id: 98, type: "emoji", val: "🍉", tag: "COMMON" },
            { id: 100, type: "emoji", val: "🍍", tag: "COMMON" }, { id: 101, type: "emoji", val: "🍓", tag: "RARE" },
            { id: 102, type: "emoji", val: "🍒", tag: "RARE" }
        ];
        let coins = parseInt(localStorage.getItem('clicker_coins')) || 300;
        let inventory = JSON.parse(localStorage.getItem('studio_gacha_inv')) || {};
        let currentMode = 0; 
        
        let wheelTimeLeft = parseInt(localStorage.getItem('gacha_wheel_cooldown')) || 0;
        let wheelTimer = null;

        const modes = [
            { title: "COMMON CAPSULE", cost: 30, emoji: "🟢", filter: "COMMON" },
            { title: "RARE CAPSULE", cost: 70, emoji: "🔵", filter: "RARE" },
            { title: "LEGENDARY CAPSULE", cost: 150, emoji: "🟡", filter: "LEGENDARY" }
        ];

        function init() {
            updateDashboard();
            renderVault();
            if (wheelTimeLeft > 0) startWheelCountdown();
        }

        function updateDashboard() {
            document.getElementById('coin-display').textContent = coins;
            localStorage.setItem('clicker_coins', coins);
            
            document.getElementById('mach-title').textContent = modes[currentMode].title;
            document.getElementById('mach-cost').textContent = `Cost: ${modes[currentMode].cost} Coins`;
            if (!document.getElementById('screen-viewport').classList.contains('shake-screen')) {
                document.getElementById('screen-output').textContent = modes[currentMode].emoji;
            }

            let ownedCount = Object.keys(inventory).length;
            document.getElementById('collected-stat').textContent = ownedCount;
        }

        function switchMachine(dir) {
            currentMode = (currentMode + dir + 3) % 3;
            updateDashboard();
        }

        function renderVault() {
            const grid = document.getElementById('vault-inventory');
            grid.innerHTML = '';

            megaCollection.forEach(item => {
                const count = inventory[item.id] || 0;
                if (count === 0) return;

                const card = document.createElement('div');
                card.className = "inv-card active";

                if (item.type === "img") {
                    const img = document.createElement('img');
                    img.src = item.file;
                    card.appendChild(img);
                } else if (item.type === "color") {
                    const sph = document.createElement('div');
                    sph.className = "inv-sphere";
                    sph.style.background = item.val;
                    card.appendChild(sph);
                } else {
                    const em = document.createElement('div');
                    em.style.fontSize = "2rem";
                    em.textContent = item.val;
                    card.appendChild(em);
                }

                const badge = document.createElement('div');
                badge.className = "inv-count";
                badge.textContent = `x${count}`;
                card.appendChild(badge);

                const overlay = document.createElement('div');
                overlay.className = "sell-overlay";
                
                let payout = item.tag === "COMMON" ? 15 : (item.tag === "RARE" ? 40 : 90);
                const btn = document.createElement('button');
                btn.className = "sell-btn";
                btn.textContent = `Sell (+${payout})`;
                btn.onclick = () => sellItem(item.id, payout);
                
                overlay.appendChild(btn);
                card.appendChild(overlay);
                grid.appendChild(card);
            });
            localStorage.setItem('studio_gacha_inv', JSON.stringify(inventory));
        }

        function sellItem(id, payout) {
            if (inventory[id] && inventory[id] > 0) {
                inventory[id]--;
                if (inventory[id] === 0) delete inventory[id];
                coins += payout;
                updateDashboard();
                renderVault();
            }
        }

        function executeRoll() {
            const mode = modes[currentMode];
            if (coins < mode.cost) {
                alert("Insufficient coins!");
                return;
            }

            coins -= mode.cost;
            updateDashboard();

            const viewport = document.getElementById('screen-viewport');
            const output = document.getElementById('screen-output');
            const crank = document.getElementById('crank-trigger');

            crank.disabled = true;
            viewport.classList.add('shake-screen');
            output.textContent = "📦";

            setTimeout(() => {
                viewport.classList.remove('shake-screen');
                crank.disabled = false;

                const pool = megaCollection.filter(item => item.tag === mode.filter);
                const prize = pool[Math.floor(Math.random() * pool.length)];

                inventory[prize.id] = (inventory[prize.id] || 0) + 1;

                if (prize.type === "img") {
                    output.innerHTML = `<img src="${prize.file}" alt="Prize">`;
                } else if (prize.type === "color") {
                    output.innerHTML = `<div class="color-preview" style="background: ${prize.val};"></div>`;
                } else {
                    output.innerHTML = `<div style="font-size:5rem;">${prize.val}</div>`;
                }

                updateDashboard();
                renderVault();
            }, 1200);
        }

        function startWheelCountdown() {
            const btn = document.getElementById('wheel-trigger');
            btn.disabled = true;
            
            clearInterval(wheelTimer);
            wheelTimer = setInterval(() => {
                wheelTimeLeft--;
                localStorage.setItem('gacha_wheel_cooldown', wheelTimeLeft);
                
                if (wheelTimeLeft <= 0) {
                    clearInterval(wheelTimer);
                    document.getElementById('wheel-timer').textContent = "Next Spin: Ready";
                    btn.disabled = false;
                } else {
                    document.getElementById('wheel-timer').textContent = `Next Spin: ${wheelTimeLeft}s`;
                }
            }, 1000);
        }

        function spinSecretWheel() {
            const output = document.getElementById('screen-output');
            const btn = document.getElementById('wheel-trigger');
            
            btn.disabled = true;
            output.textContent = "🔮";
            
            setTimeout(() => {
                const roll = Math.random();
                if (roll < 0.4) {
                    const cash = Math.floor(Math.random() * 401) + 200;
                    coins += cash;
                    output.innerHTML = `<div style="font-size:2.5rem; font-weight:bold; color:#fbbf24;">💰<br>+${cash}</div>`;
                } else {
                    const randItem = megaCollection[Math.floor(Math.random() * megaCollection.length)];
                    inventory[randItem.id] = (inventory[randItem.id] || 0) + 1;
                    
                    if (randItem.type === "img") output.innerHTML = `<img src="${randItem.file}">`;
                    else if (randItem.type === "color") output.innerHTML = `<div class="color-preview" style="background:${randItem.val};"></div>`;
                    else output.innerHTML = `<div style="font-size:5rem;">${randItem.val}</div>`;
                }

                wheelTimeLeft = 180; 
                startWheelCountdown();
                updateDashboard();
                renderVault();
            }, 1000);
        }

        function triggerSystemWipe() {
            if (confirm("🚨 BOOT SECTOR CORRUPTION DETECTED. Wipe full core storage?")) {
                if (confirm("🚨 WARNING: This will destroy your clicker balance, achievements, and entire vault! Continue?")) {
                    if (confirm("🚨 ARE YOU 100% ABSOLUTELY SURE? DATA LOSS IS PERMANENT!")) {
                        localStorage.clear();
                        alert("Core data purged. System rebooting...");
                        window.location.reload();
                    }
                }
            }
        }

        init();
    </script>
</body>
</html>
