<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Toy Machine</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-button {
            background: #4b2e1e;
            color: #6ee7b7;
            border: 3px dashed #34d399;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
            background: #3d2314;
        }
        h1 {
            color: #6ee7b7;
            text-shadow: 4px 4px #3d2314;
            font-size: 3.5rem;
            letter-spacing: 1px;
        }
        .game-container {
            max-width: 950px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            padding: 10px;
        }
        .panel {
            background: #2b1810;
            border: 4px solid #34d399;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .panel-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 15px;
            border-bottom: 2px dashed #34d399;
            padding-bottom: 8px;
        }
        .oven-box {
            position: relative;
            display: inline-block;
            margin: 15px 0;
        }
        .alert-indicator {
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 2.5rem;
            animation: bounce 0.5s infinite alternate;
            display: none;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .machine-screen {
            background: #150b06;
            border: 3px inset #34d399;
            height: 160px;
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .machine-screen img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            image-rendering: pixelated;
            border-radius: 8px;
        }
        .action-btn {
            background: #fbbf24;
            color: #1f110a;
            border: 3px solid #fff;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 4px #b45309;
            cursor: pointer;
            width: 100%;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #b45309;
        }
        .action-btn:disabled {
            background: #4b2e1e;
            color: #1f110a;
            border-color: #3d2314;
            box-shadow: none;
            transform: none;
            cursor: default;
        }
        .shake {
            animation: shakeAnim 0.1s infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-2deg); }
            100% { transform: translate(1px, 2px) rotate(2deg); }
        }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="nav-button">HOME FACTS 📑</a>
        <a href="mint-choco.html" class="nav-button">MINT-CHOCO ZONE 🍫</a>
        <a href="other.html" class="nav-button">OTHER ZONE 🐛</a>
    </div>

    <h1>Capsule Toy Machine</h1>

    <div class="game-container" style="max-width: 1200px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
        
        <div class="panel">
            <div class="panel-title">Baking Oven Income</div>
            <div class="oven-box">
                <div style="font-size: 5rem; margin: 10px 0;" id="oven-sprite"> oven </div>
                <div class="alert-indicator" id="oven-alert">❗</div>
            </div>
            <div style="font-size: 1.1rem; margin-bottom: 15px;" id="oven-timer-text">Ready in: 60s</div>
            <button class="action-btn" id="claim-oven-btn" disabled>Claim Income</button>
        </div>

        <div class="panel" style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; font-size: 1.8rem; font-weight: bold; background: #150b06; border: 3px solid #34d399; border-radius: 12px; padding: 10px;">
            <span>💰 Balance: </span>
            <span id="balance-count">0</span>
        </div>

        <div class="panel">
            <div class="panel-title" style="color: #a7f3d0;">Common Machine</div>
            <div class="machine-screen" id="screen-box-1" style="font-size: 4rem;">🟢</div>
            <div style="font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; color: #a7f3d0;" id="rarity-text-1">Cost: 30 Coins</div>
            <button class="action-btn" id="roll-btn-1" onclick="rollMachine(1)">Roll Common</button>
        </div>

        <div class="panel">
            <div class="panel-title" style="color: #3b82f6;">Rare Machine</div>
            <div class="machine-screen" id="screen-box-2" style="font-size: 4rem;">🔵</div>
            <div style="font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; color: #3b82f6;" id="rarity-text-2">Cost: 70 Coins</div>
            <button class="action-btn" id="roll-btn-2" onclick="rollMachine(2)">Roll Rare</button>
        </div>

        <div class="panel">
            <div class="panel-title" style="color: #fbbf24;">Legendary Machine</div>
            <div class="machine-screen" id="screen-box-3" style="font-size: 4rem;">🟡</div>
            <div style="font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; color: #fbbf24;" id="rarity-text-3">Cost: 150 Coins</div>
            <button class="action-btn" id="roll-btn-3" onclick="rollMachine(3)">Roll Legend</button>
        </div>

        <div class="panel" style="grid-column: 1 / -1;">
            <div class="panel-title">Your Collection Progress</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 15px;" id="inventory-grid"></div>
        </div>

    </div>
    <script>
        const commonItems = ['cat1.jpg', 'cat2.jpg', 'cat3.jpg'];
        const rareItems = ['mint1.jpg', 'mint2.jpg', 'choco1.jpg', 'choco2.jpg'];
        const legendItems = ['cat.gif', 'helper.png', 'helper2.png'];

        let coins = parseInt(localStorage.getItem('clicker_coins')) || 200;
        let unlockedGacha = JSON.parse(localStorage.getItem('gacha_collection')) || [];
        
        let ovenTimeLeft = 60;
        let ovenTimerInterval = null;
        let isOvenReady = false;

        const balanceCount = document.getElementById('balance-count');
        const inventoryGrid = document.getElementById('inventory-grid');
        const ovenTimerText = document.getElementById('oven-timer-text');
        const claimOvenBtn = document.getElementById('claim-oven-btn');
        const ovenAlert = document.getElementById('oven-alert');

        function init() {
            updateBalance();
            renderInventory();
            startOvenTimer();
        }

        function updateBalance() {
            balanceCount.textContent = coins;
            localStorage.setItem('clicker_coins', coins);
        }

        function renderInventory() {
            inventoryGrid.innerHTML = '';
            
            const allItems = [
                { list: commonItems, tag: 'COMMON', color: '#a7f3d0' },
                { list: rareItems, tag: 'RARE', color: '#3b82f6' },
                { list: legendItems, tag: 'LEGENDARY', color: '#fbbf24' }
            ];

            allItems.forEach(group => {
                group.list.forEach(file => {
                    const box = document.createElement('div');
                    box.style.cssText = `border: 3px dashed ${group.color}; background: #150b06; padding: 10px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;`;
                    
                    if (unlockedGacha.includes(file)) {
                        const img = document.createElement('img');
                        img.src = file;
                        img.style.cssText = "width: 80px; height: 80px; object-fit: contain; image-rendering: pixelated;";
                        box.appendChild(img);
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.style.cssText = `width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #4b2e1e; font-weight: bold;`;
                        placeholder.textContent = '?';
                        box.appendChild(placeholder);
                    }

                    const label = document.createElement('div');
                    label.style.cssText = `font-size: 0.7rem; font-weight: bold; margin-top: 5px; color: ${group.color};`;
                    label.textContent = group.tag;
                    box.appendChild(label);

                    inventoryGrid.appendChild(box);
                });
            });
        }

        function startOvenTimer() {
            isOvenReady = false;
            ovenTimeLeft = 60;
            ovenAlert.style.display = 'none';
            claimOvenBtn.disabled = true;
            ovenTimerText.textContent = `Ready in: ${ovenTimeLeft}s`;

            clearInterval(ovenTimerInterval);
            ovenTimerInterval = setInterval(() => {
                ovenTimeLeft--;
                ovenTimerText.textContent = `Ready in: ${ovenTimeLeft}s`;

                if (ovenTimeLeft <= 0) {
                    clearInterval(ovenTimerInterval);
                    isOvenReady = true;
                    ovenAlert.style.display = 'block';
                    claimOvenBtn.disabled = false;
                    ovenTimerText.textContent = "Baked! Collection Ready!";
                }
            }, 1000);
        }

        claimOvenBtn.addEventListener('click', () => {
            if (!isOvenReady) return;
            coins += 150;
            updateBalance();
            startOvenTimer();
        });

        function rollMachine(type) {
            let cost, selectedList, tag, color, defaultEmoji, capsuleEmoji;
            const screen = document.getElementById(`screen-box-${type}`);
            const rarityLabel = document.getElementById(`rarity-text-${type}`);
            const btn = document.getElementById(`roll-btn-${type}`);

            if (type === 1) {
                cost = 30; selectedList = commonItems; tag = "COMMON"; color = "#a7f3d0"; defaultEmoji = "🟢"; capsuleEmoji = "🍬";
            } else if (type === 2) {
                cost = 70; selectedList = rareItems; tag = "RARE"; color = "#3b82f6"; defaultEmoji = "🔵"; capsuleEmoji = "🍭";
            } else {
                cost = 150; selectedList = legendItems; tag = "LEGENDARY"; color = "#fbbf24"; defaultEmoji = "🟡"; capsuleEmoji = "✨";
            }

            if (coins < cost) {
                rarityLabel.textContent = "No Coins!";
                setTimeout(() => { rarityLabel.textContent = `Cost: ${cost} Coins`; }, 1500);
                return;
            }

            coins -= cost;
            updateBalance();

            btn.disabled = true;
            rarityLabel.textContent = "ROLLING...";
            screen.innerHTML = capsuleEmoji;
            screen.classList.add('shake');

            setTimeout(() => {
                screen.classList.remove('shake');
                btn.disabled = false;
                rarityLabel.textContent = `Cost: ${cost} Coins`;

                const jackpotRoll = Math.random();
                if (jackpotRoll <= 0.30) {
                    const rewardCoins = Math.floor(Math.random() * 501) + 1000;
                    coins += rewardCoins;
                    updateBalance();
                    screen.innerHTML = `<div style="text-align:center; font-size:1.1rem; font-weight:bold; color:#fbbf24;">💰<br>+${rewardCoins}</div>`;
                    setTimeout(() => { screen.innerHTML = defaultEmoji; }, 3000);
                    return;
                }

                const wonFile = selectedList[Math.floor(Math.random() * selectedList.length)];
                
                if (!unlockedGacha.includes(wonFile)) {
                    unlockedGacha.push(wonFile);
                    localStorage.setItem('gacha_collection', JSON.stringify(unlockedGacha));
                }

                screen.innerHTML = `<img src="${wonFile}" alt="Won item">`;
                renderInventory();

                setTimeout(() => { screen.innerHTML = defaultEmoji; }, 4000);
            }, 1200);
        }

        init();
    </script>
</body>
</html>
