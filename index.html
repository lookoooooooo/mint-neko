<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko</title>
    <style>
        body {
            background-color: #2b1810;
            color: #a7f3d0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #34d399;
            text-shadow: 3px 3px #4b2e1e;
            font-size: 3.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .box {
            border: 4px dashed #34d399;
            background: #3d2314;
            padding: 15px;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .box:hover {
            transform: scale(1.03) rotate(-1deg);
            border-color: #6ee7b7;
        }
        img, video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        button {
            background: #34d399;
            color: #2b1810;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px #1f110a;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px #1f110a;
        }
        #meow-counter {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <h1>MINT NEKO ZONE</h1>
    
    <button onclick="meowInteractive()">PRESS FOR MEOW</button>
    <div id="meow-counter">Total Meows: <span id="count">0</span></div>

    <div class="grid">
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="https://unsplash.com" alt="Mint Cat">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="https://giphy.com" alt="Neko Gif">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="https://unsplash.com" alt="Chocolate Cat">
        </div>
    </div>

    <script>
        let meows = 0;
        function meowInteractive() {
            meows++;
            document.getElementById('count').innerText = meows;
            playAudio('https://mixkit.co');
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(61, 35, 20)' ? '#2b1810' : '#3d2314';
        }
        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
