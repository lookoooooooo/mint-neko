<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Web Zone</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff0055;
            text-shadow: 3px 3px #00ffff;
            font-size: 3rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .box {
            border: 4px dashed #00ff00;
            background: #222;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .box:hover {
            transform: scale(1.05) rotate(2deg);
            background: #333;
        }
        img, video {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        button {
            background: #ffcc00;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px #ff0055;
        }
        button:active {
            transform: translate(5px, 5px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>WELCOME TO THE ZONE</h1>
    
    <button onclick="playSurprise()">CLICK FOR INTERACTIVE</button>

    <div class="grid">
        <div class="box">
            <img src="https://giphy.com" alt="gif">
        </div>
        <div class="box" onclick="alert('USA! USA! 🇺🇸')">
            <img src="https://unsplash.com" alt="pic">
        </div>
        <div class="box">
            <video autoplay loop muted playsinline>
                <source src="https://w3schools.com" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        function playSurprise() {
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(17, 17, 17)' ? '#440066' : '#111';
            const audio = new Audio('https://soundjay.com');
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
