<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Mint Neko 🌲</title>
  <style>
    body {
      background-color: #121214;
      color: #e1e1e6;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #29292e;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    h1 {
      color: #00b37e;
      margin: 0;
      font-size: 24px;
    }
    .post-form {
      background: #202024;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #29292e;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 80px;
      background: #121214;
      border: 1px solid #29292e;
      border-radius: 6px;
      color: #fff;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 10px;
    }
    input[type='file'] {
      margin-bottom: 15px;
      display: block;
    }
    button {
      background: #00b37e;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #00875f;
    }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .post {
      background: #202024;
      border: 1px solid #29292e;
      padding: 15px;
      border-radius: 8px;
    }
    .post img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <div class='container'>
    <header>
      <h1>Mint Neko 🌲</h1>
    </header>

    <div class='post-form'>
      <textarea id='postText' placeholder='Share something minty...'></textarea>
      <input type='file' id='fileInput' accept='image/*'>
      <button onclick='createPost()'>Publish</button>
    </div>

    <div class='feed' id='feed'>
    </div>
  </div>

  <script>
    function createPost() {
      var text = document.getElementById('postText').value;
      var fileInput = document.getElementById('fileInput');
      var feed = document.getElementById('feed');

      var postDiv = document.createElement('div');
      postDiv.className = 'post';

      var textElement = document.createElement('p');
      textElement.textContent = text;
      postDiv.appendChild(textElement);

      var imgElement = document.createElement('img');
      imgElement.src = URL.createObjectURL(fileInput.files[0]);
      postDiv.appendChild(imgElement);

      feed.insertBefore(postDiv, feed.firstChild);

      document.getElementById('postText').value = '';
      fileInput.value = '';
    }
  </script>

</body>
</html>
