<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko</title>
    <style>
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            cursor: url('cursor.png'), auto;
        }
        h1 {
            color: #6ee7b7;
            text-shadow: 4px 4px #3d2314;
            font-size: 3.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .box {
            border: 5px dashed #34d399;
            background: #2b1810;
            padding: 15px;
            cursor: url('cursor.png'), pointer;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .box:hover {
            transform: scale(1.03) rotate(-1deg);
            border-color: #6ee7b7;
            box-shadow: 0 0 25px rgba(110, 231, 183, 0.5);
        }
        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }
        .top-focus {
            object-position: center 20%;
        }
        button {
            background: #34d399;
            color: #1f110a;
            border: 3px solid #6ee7b7;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: url('cursor.png'), pointer;
            box-shadow: 0 6px #0f0805, 0 0 15px rgba(52, 211, 153, 0.4);
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px #0f0805;
        }
        #meow-counter {
            font-size: 1.8rem;
            margin-top: 20px;
            color: #6ee7b7;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
        .corner-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 100px;
            cursor: url('cursor.png'), pointer;
            transition: transform 0.2s;
        }
        .corner-widget:hover {
            transform: scale(1.1);
        }
        .corner-widget img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .bubble {
            position: fixed;
            bottom: 130px;
            right: 20px;
            background: #34d399;
            color: #1f110a;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            max-width: 200px;
            font-size: 0.9rem;
            border: 2px solid #6ee7b7;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>MINT NEKO ZONE</h1>
    
    <button onclick="meowInteractive()">PRESS FOR MEOW</button>
    <div id="meow-counter">Total Meows: <span id="count">0</span></div>

    <div class="grid">
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat1.jpg" alt="Mint Cat" class="top-focus">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat2.jpg" alt="Neko Photo">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat3.jpg" alt="Chocolate Cat">
        </div>
    </div>

    <div class="bubble" id="quote-bubble"></div>
    <div class="corner-widget" onclick="showNekoTalk()">
        <img src="cat_widget.gif" alt="Widget Neko">
    </div>

    <script>
        let meows = 0;
        const phrases = [
            "Feed me mint ice cream!", "Meow? Purr...", "Humans are so boring.", "Is it nap time yet?",
            "Give me more chocolate!", "I rule this mint zone.", "Pet my head, please.", "Catching lasers is my job.",
            "Meow means YES.", "More meows, more power!", "Look at my cute nose.", "Do you have snacks?",
            "Mint and chocolate is best.", "Sleeping 18 hours today.", "Don't touch my paws!", "Paws up!",
            "I see a bird outside.", "Can I bite your keyboard?", "Neko energy activated.", "Everything belongs to me.",
            "Stay minty, friend.", "Purrfectly sweet.", "Just a little kitten.", "Meow all day long.",
            "I love this website.", "Where is my fish?", "Chasing my own tail.", "Wake up and pet me.",
            "Best neko in the world.", "Munching on grass..."
        ];

        function meowInteractive() {
            meows++;
            document.getElementById('count').innerText = meows;
            playAudio('https://mixkit.co');
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(43, 24, 16)' ? '#1f110a' : '#2b1810';
        }

        function showNekoTalk() {
            playAudio('https://mixkit.co');
            const bubble = document.getElementById('quote-bubble');
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            bubble.innerText = randomPhrase;
            bubble.style.display = 'block';
            setTimeout(() => { bubble.style.display = 'none'; }, 3000);
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
