<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Mint Neko 🌲</title>
  <style>
    body { background-color: #2b1d16; color: #f7f4f2; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background-color: #3d2a20; border-bottom: 2px solid #5ce1b6; display: flex; align-items: center; padding: 0 10px; z-index: 10; }
    .categories { display: flex; gap: 8px; overflow-x: auto; width: 100%; }
    .cat-btn { background: #4e3629; color: #f7f4f2; border: 1px solid #5e4335; padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .cat-btn.active { background: #5ce1b6; color: #2b1d16; font-weight: bold; border-color: #5ce1b6; }
    .screen { display: none; padding: 20px; padding-top: 80px; padding-bottom: 90px; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
    .screen.active { display: block; }
    .feed { display: flex; flex-direction: column; gap: 20px; }
    .post { background: #3d2a20; border: 1px solid #4e3629; padding: 15px; border-radius: 12px; position: relative; }
    .post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .post-author img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid #5ce1b6; }
    .post-author span { font-weight: bold; color: #5ce1b6; }
    .post-title { font-size: 18px; font-weight: bold; margin: 10px 0 5px 0; color: #fff; }
    .post-desc { font-size: 14px; color: #c7b3aa; margin: 0 0 10px 0; }
    .post-media img, .post-media video { width: 100%; border-radius: 8px; display: block; }
    .post-actions { display: flex; gap: 15px; margin-top: 10px; }
    .like-btn { background: none; border: none; color: #c7b3aa; cursor: pointer; font-size: 18px; display: flex; align-items: center; gap: 5px; }
    .like-btn.liked { color: #5ce1b6; }
    .profile-header { text-align: center; margin-bottom: 30px; }
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #5ce1b6; }
    .profile-name { font-size: 24px; margin: 10px 0 5px 0; color: #5ce1b6; }
    .profile-bio { color: #c7b3aa; margin-bottom: 15px; }
    .edit-form, .preview-container { background: #3d2a20; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #4e3629; }
    .edit-form input, .edit-form textarea, .upload-dialog input[type='text'], .upload-dialog textarea { width: 100%; background: #2b1d16; border: 1px solid #4e3629; color: #fff; padding: 10px; margin-bottom: 10px; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    .btn { background: #5ce1b6; color: #2b1d16; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #4e3629; color: #f7f4f2; border: 1px solid #5e4335; padding: 8px 15px; border-radius: 6px; cursor: pointer; display: inline-block; margin-bottom: 10px; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background-color: #3d2a20; border-top: 2px solid #5ce1b6; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
    .menu-btn { background: none; border: none; color: #c7b3aa; font-size: 26px; cursor: pointer; }
    .menu-btn.active { color: #5ce1b6; }
    .upload-dialog { background: #3d2a20; padding: 20px; border-radius: 12px; border: 1px solid #4e3629; }
    .upload-dialog h3 { color: #5ce1b6; margin-top: 0; }
    .upload-dialog select { width: 100%; background: #2b1d16; border: 1px solid #4e3629; color: #fff; padding: 8px; margin-bottom: 15px; border-radius: 6px; }
    .preview-box { width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; margin-top: 10px; display: none; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #5ce1b6; color: #2b1d16; padding: 12px 24px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; z-index: 100; }
    .profile-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #4e3629; padding-bottom: 10px; }
  </style>
</head>
<body>

  <div id='toast' class='toast'>Success! Post published ✨</div>

  <div class='top-bar' id='topBarMenu'>
    <div class='categories'>
      <button class='cat-btn active' id='cat-all' onclick='filterCategory("all")'>For You 🤖</button>
      <button class='cat-btn' id='cat-chocolate-cat' onclick='filterCategory("chocolate-cat")'>Chocolate Cat</button>
      <button class='cat-btn' id='cat-mint-ice-cream' onclick='filterCategory("mint-ice-cream")'>Mint Ice Cream</button>
      <button class='cat-btn' id='cat-chocolate-pieces' onclick='filterCategory("chocolate-pieces")'>Chocolate Pieces</button>
    </div>
  </div>

  <div id='feedScreen' class='screen active'>
    <div class='feed' id='mainFeed'></div>
  </div>

  <div id='uploadScreen' class='screen'>
    <div class='upload-dialog'>
      <h3>Create New Post</h3>
      <select id='postCategory'>
        <option value='chocolate-cat'>Chocolate Cat (Images)</option>
        <option value='mint-ice-cream'>Mint Ice Cream (Shorts)</option>
        <option value='chocolate-pieces'>Chocolate Pieces (Long Videos)</option>
      </select>
      
      <input type='text' id='postTitle' placeholder='Post Title (e.g. My Cute Kitten)'>
      <textarea id='postDesc' placeholder='Description / Tags...'></textarea>
      
      <button class='btn-secondary' onclick='document.getElementById("mediaFile").click()'>Choose File</button>
      <input type='file' id='mediaFile' accept='image/*,video/*' style='display:none;' onchange='previewMedia()'>
      
      <div class='preview-container' id='previewContainer' style='display:none; margin-top:15px;'>
        <p style='margin:0 0 10px 0; font-size:14px; color:#5ce1b6;'>Preview:</p>
        <img id='imgPreview' class='preview-box'>
        <video id='videoPreview' class='preview-box' controls></video>
      </div>

      <button class='btn' id='publishBtn' onclick='uploadPost()' style='width:100%; margin-top:20px;'>Publish</button>
    </div>
  </div>

  <div id='profileScreen' class='screen'>
    <div class='profile-header'>
      <img id='userAvatar' class='profile-avatar' src='https://placehold.co'>
      <h2 id='userName' class='profile-name'>My Name</h2>
      <p id='userBio' class='profile-bio'>No bio yet</p>
      <button class='btn' id='editProfileBtn' onclick='toggleEditForm()'>Edit Profile</button>
    </div>

    <div id='editForm' class='edit-form' style='display: none;'>
      <input type='text' id='editName' placeholder='New Name'>
      <textarea id='editBio' placeholder='New Bio'></textarea>
      <button class='btn-secondary' onclick='document.getElementById("editAvatarInput").click()'>Choose New Avatar</button>
      <input type='file' id='editAvatarInput' accept='image/*' style='display:none;'>
      <button class='btn' onclick='saveProfile()' style='margin-left:10px;'>Save Changes</button>
    </div>

    <div class='profile-tabs'>
      <button class='cat-btn active' id='prof-tab-all' onclick='filterProfileFeed("all")'>All My Posts</button>
      <button class='cat-btn' id='prof-tab-pics' onclick='filterProfileFeed("chocolate-cat")'>Images</button>
      <button class='cat-btn' id='prof-tab-shorts' onclick='filterProfileFeed("mint-ice-cream")'>Shorts</button>
      <button class='cat-btn' id='prof-tab-long' onclick='filterProfileFeed("chocolate-pieces")'>Long</button>
    </div>
    <div class='feed' id='myFeed'></div>
  </div>

  <div id='viewProfileScreen' class='screen'>
    <div class='profile-header'>
      <button class='btn' style='float: left;' onclick='switchTab("feed")'>Back</button>
      <br><br>
      <img id='viewAvatar' class='profile-avatar' src=''>
      <h2 id='viewName' class='profile-name'></h2>
      <p id='viewBio' class='profile-bio'></p>
    </div>
    <div class='feed' id='viewFeed'></div>
  </div>

  <div class='bottom-bar'>
    <button class='menu-btn active' id='btn-feed' onclick='switchTab("feed")'>🏠</button>
    <button class='menu-btn' id='btn-upload' onclick='switchTab("upload")'>➕</button>
    <button class='menu-btn' id='btn-profile' onclick='switchTab("profile")'>👤</button>
  </div>
  <script>
    var currentUser = { id: 'user_me', name: 'Mint Lover', bio: 'Creating something minty...', avatar: 'https://placehold.co' };
    
    var mockUsers = {
      'user_neko1': { id: 'user_neko1', name: 'ChocoCat_99', bio: 'I love chocolate gifs!', avatar: 'https://placehold.co' },
      'user_neko2': { id: 'user_neko2', name: 'IceCreamQueen', bio: 'Short video maker 🍦', avatar: 'https://placehold.co' }
    };

    var posts = [
      { id: 1, userId: 'user_neko1', category: 'chocolate-cat', title: 'Fluffy Friend', desc: 'Look at this sweet chocolate kitten! #cats #cute', type: 'image', url: 'https://placehold.co' },
      { id: 2, userId: 'user_neko2', category: 'mint-ice-cream', title: 'Summer Vibes', desc: 'Making the best mint ice cream at home 🍦 #shorts', type: 'video', url: 'https://w3schools.com' }
    ];

    var userInteractions = { 'chocolate-cat': 0, 'mint-ice-cream': 0, 'chocolate-pieces': 0 };

    if (localStorage.getItem('mint_posts')) { posts = JSON.parse(localStorage.getItem('mint_posts')); }
    if (localStorage.getItem('mint_user')) { currentUser = JSON.parse(localStorage.getItem('mint_user')); }
    if (localStorage.getItem('mint_interactions')) { userInteractions = JSON.parse(localStorage.getItem('mint_interactions')); }

    window.onload = function() {
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userBio').textContent = currentUser.bio;
      document.getElementById('userAvatar').src = currentUser.avatar;
      renderFeeds('all');
    };

    function showToast() {
      var toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 3000);
    }

    function previewMedia() {
      var fileInput = document.getElementById('mediaFile');
      var img = document.getElementById('imgPreview');
      var video = document.getElementById('videoPreview');
      var container = document.getElementById('previewContainer');

      if (fileInput.files.length === 0) return;
      var file = fileInput.files[0];
      container.style.display = 'block';

      if (file.type.includes('video')) {
        img.style.display = 'none';
        video.style.display = 'block';
        video.src = URL.createObjectURL(file);
      } else {
        video.style.display = 'none';
        img.style.display = 'block';
        img.src = URL.createObjectURL(file);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.querySelectorAll('.menu-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById('topBarMenu').style.display = (tab === 'feed') ? 'flex' : 'none';

      if (tab === 'feed') { document.getElementById('feedScreen').classList.add('active'); document.getElementById('btn-feed').classList.add('active'); renderFeeds('all'); }
      else if (tab === 'upload') { document.getElementById('uploadScreen').classList.add('active'); document.getElementById('btn-upload').classList.add('active'); }
      else if (tab === 'profile') { document.getElementById('profileScreen').classList.add('active'); document.getElementById('btn-profile').classList.add('active'); filterProfileFeed('all'); }
    }

    function toggleEditForm() {
      var form = document.getElementById('editForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
      document.getElementById('editName').value = currentUser.name;
      document.getElementById('editBio').value = currentUser.bio;
    }

    async function saveProfile() {
      var name = document.getElementById('editName').value;
      var bio = document.getElementById('editBio').value;
      var avatarFileInput = document.getElementById('editAvatarInput');
      currentUser.name = name;
      currentUser.bio = bio;

      if (avatarFileInput.files.length > 0) {
        var file = avatarFileInput.files[0];
        var response = await fetch('/api/upload?filename=' + file.name, { method: 'POST', body: file });
        var blobData = await response.json();
        currentUser.avatar = blobData.url;
      }

      localStorage.setItem('mint_user', JSON.stringify(currentUser));
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userBio').textContent = currentUser.bio;
      document.getElementById('userAvatar').src = currentUser.avatar;
      toggleEditForm();
    }
    async function uploadPost() {
      var cat = document.getElementById('postCategory').value;
      var titleInput = document.getElementById('postTitle');
      var descInput = document.getElementById('postDesc');
      var fileInput = document.getElementById('mediaFile');
      var btn = document.getElementById('publishBtn');
      
      if (fileInput.files.length === 0) return alert('Choose file first');
      
      var file = fileInput.files[0];
      btn.disabled = true;
      btn.textContent = 'Uploading...';

      var response = await fetch('/api/upload?filename=' + file.name, { method: 'POST', body: file });
      var blobData = await response.json();
      
      var newPost = {
        id: Date.now(),
        userId: currentUser.id,
        category: cat,
        title: titleInput.value || 'Untitled',
        desc: descInput.value || '',
        type: file.type.includes('video') ? 'video' : 'image',
        url: blobData.url,
        likes: 0
      };

      posts.unshift(newPost);
      localStorage.setItem('mint_posts', JSON.stringify(posts));
      
      btn.disabled = false;
      btn.textContent = 'Publish';
      fileInput.value = '';
      titleInput.value = '';
      descInput.value = '';
      document.getElementById('previewContainer').style.display = 'none';
      
      showToast();
      switchTab('feed');
    }

    function trackInteraction(category, points) {
      userInteractions[category] = (userInteractions[category] || 0) + points;
      localStorage.setItem('mint_interactions', JSON.stringify(userInteractions));
    }

    function toggleLike(postId, category) {
      posts.forEach(function(p) {
        if (p.id === postId) {
          if (p.isLiked) { p.likes--; p.isLiked = false; } 
          else { p.likes++; p.isLiked = true; trackInteraction(category, 5); }
        }
      });
      localStorage.setItem('mint_posts', JSON.stringify(posts));
      var activeBtn = document.querySelector('.categories .cat-btn.active');
      var currentCat = activeBtn ? activeBtn.id.replace('cat-', '') : 'all';
      renderFeeds(currentCat);
    }

    function getRecommendedPosts() {
      var sortedCats = Object.keys(userInteractions).sort(function(a, b) {
        return userInteractions[b] - userInteractions[a];
      });
      var recommended = [];
      sortedCats.forEach(function(cat) {
        posts.forEach(function(p) { if (p.category === cat) recommended.push(p); });
      });
      posts.forEach(function(p) { if (!recommended.includes(p)) recommended.push(p); });
      return recommended;
    }

    function renderFeeds(filterCat) {
      var mainFeed = document.getElementById('mainFeed');
      mainFeed.innerHTML = '';
      var displayPosts = (filterCat === 'all') ? getRecommendedPosts() : posts;

      displayPosts.forEach(function(post) {
        if (filterCat !== 'all' && post.category !== filterCat) return;

        var author = post.userId === currentUser.id ? currentUser : mockUsers[post.userId];
        if (!author) return;

        var postHtml = document.createElement('div');
        postHtml.className = 'post';

        var authorDiv = document.createElement('div');
        authorDiv.className = 'post-author';
        authorDiv.onclick = function() { openUserProfile(post.userId); };
        authorDiv.innerHTML = '<img src="' + author.avatar + '"><span>' + author.name + '</span>';
        postHtml.appendChild(authorDiv);

        var titleDiv = document.createElement('div');
        titleDiv.className = 'post-title';
        titleDiv.textContent = post.title;
        postHtml.appendChild(titleDiv);

        var descDiv = document.createElement('div');
        descDiv.className = 'post-desc';
        descDiv.textContent = post.desc;
        postHtml.appendChild(descDiv);

        var mediaDiv = document.createElement('div');
        mediaDiv.className = 'post-media';
        if (post.type === 'video') {
          var videoElement = document.createElement('video');
          videoElement.src = post.url;
          videoElement.controls = true;
          videoElement.onplay = function() { trackInteraction(post.category, 2); };
          mediaDiv.appendChild(videoElement);
        } else {
          mediaDiv.innerHTML = '<img src="' + post.url + '">';
        }
        postHtml.appendChild(mediaDiv);

        var actionsDiv = document.createElement('div');
        actionsDiv.className = 'post-actions';
        var likedClass = post.isLiked ? 'liked' : '';
        actionsDiv.innerHTML = '<button class="like-btn ' + likedClass + '" onclick="toggleLike(' + post.id + ', \'' + post.category + '\')">💚 <span>' + (post.likes || 0) + '</span></button>';
        postHtml.appendChild(actionsDiv);

        mainFeed.appendChild(postHtml);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.categories .cat-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById('cat-' + cat).classList.add('active');
      renderFeeds(cat);
    }

    function filterProfileFeed(cat) {
      document.querySelectorAll('.profile-tabs .cat-btn').forEach(function(b) { b.classList.remove('active'); });
      if (cat === 'all') document.getElementById('prof-tab-all').classList.add('active');
      if (cat === 'chocolate-cat') document.getElementById('prof-tab-pics').classList.add('active');
      if (cat === 'mint-ice-cream') document.getElementById('prof-tab-shorts').classList.add('active');
      if (cat === 'chocolate-pieces') document.getElementById('prof-tab-long').classList.add('active');

      var myFeed = document.getElementById('myFeed');
      myFeed.innerHTML = '';

      posts.forEach(function(post) {
        if (post.userId !== currentUser.id) return;
        if (cat !== 'all' && post.category !== cat) return;

        var postHtml = document.createElement('div');
        postHtml.className = 'post';

        var titleDiv = document.createElement('div');
        titleDiv.className = 'post-title';
        titleDiv.textContent = post.title;
        postHtml.appendChild(titleDiv);

        var mediaDiv = document.createElement('div');
        mediaDiv.className = 'post-media';
        if (post.type === 'video') { mediaDiv.innerHTML = '<video src="' + post.url + '" controls></video>'; }
        else { mediaDiv.innerHTML = '<img src="' + post.url + '">'; }
        postHtml.appendChild(mediaDiv);
        myFeed.appendChild(postHtml);
      });
    }

    function openUserProfile(userId) {
      if (userId === currentUser.id) { switchTab('profile'); return; }
      var author = mockUsers[userId];
      document.getElementById('topBarMenu').style.display = 'none';
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('viewProfileScreen').classList.add('active');
      document.getElementById('viewName').textContent = author.name;
      document.getElementById('viewBio').textContent = author.bio;
      document.getElementById('viewAvatar').src = author.avatar;
      
      var viewFeed = document.getElementById('viewFeed');
      viewFeed.innerHTML = '';
      posts.forEach(function(post) {
        if (post.userId === userId) {
          var postHtml = document.createElement('div');
          postHtml.className = 'post';
          
          var titleDiv = document.createElement('div');
          titleDiv.className = 'post-title';
          titleDiv.textContent = post.title;
          postHtml.appendChild(titleDiv);

          var mediaDiv = document.createElement('div');
          mediaDiv.className = 'post-media';
          if (post.type === 'video') { mediaDiv.innerHTML = '<video src="' + post.url + '" controls></video>'; }
          else { mediaDiv.innerHTML = '<img src="' + post.url + '">'; }
          postHtml.appendChild(mediaDiv);
          
          viewFeed.appendChild(postHtml);
        }
      });
    }
  </script>
</body>
</html>
