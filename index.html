<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko Facts</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            transition: background-color 0.1s;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-button {
            background: #4b2e1e;
            color: #6ee7b7;
            border: 3px dashed #34d399;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
            background: #3d2314;
        }
        h1 {
            color: #6ee7b7;
            text-shadow: 4px 4px #3d2314;
            font-size: 3.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .box {
            border: 5px dashed #34d399;
            background: #2b1810;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .grid img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }
        .top-focus {
            object-position: center 10%;
        }
        @keyframes danceCat {
            0% { transform: scale(1) rotate(0deg) translateY(0); }
            25% { transform: scale(1.1) rotate(8deg) translateY(-15px); }
            50% { transform: scale(1) rotate(0deg) translateY(0); }
            75% { transform: scale(1.1) rotate(-8deg) translateY(-15px); }
            100% { transform: scale(1) rotate(0deg) translateY(0); }
        }
        .dancing {
            animation: danceCat 0.5s infinite linear !important;
        }
        .candy-emoji {
            position: fixed;
            font-size: 2.5rem;
            z-index: 9999;
            pointer-events: none;
            animation: fallCandy 3s linear forwards;
        }
        @keyframes fallCandy {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    <script>
        const catFacts = [
            "Cats sleep for about 70% of their lives.",
            "A cat has 32 muscles in each outer ear.",
            "Cats can't taste sweetness at all.",
            "The first cat in space was a French cat named Felicette.",
            "Cats make about 100 different vocal sounds.",
            "A cat's nose print is completely unique, just like a human fingerprint.",
            "Cats are near-sighted, but their peripheral vision is amazing.",
            "A cat can jump up to six times its height.",
            "The oldest known pet cat was found in a 9,500-year-old grave in Cyprus.",
            "Cats use their whiskers to feel if they can fit through a space.",
            "Grown-up cats only meow to communicate with humans.",
            "A cat's purr vibrates at a frequency that can improve bone density.",
            "Cats sweat only through their foot paws.",
            "Every cat has 18 toes in total: 5 on front paws, 4 on back paws.",
            "The richest cat in the world inherited 13 million dollars.",
            "Cats can rotate their ears 180 degrees independently.",
            "A group of adult cats is called a 'clowder'.",
            "A group of tiny kittens is officially called a 'kindle'.",
            "Cats have a third eyelid called the nictitating membrane.",
            "Black cats are actually considered good luck in Japan.",
            "Cats can run at speeds of up to 30 miles per hour.",
            "A cat's heart beats two to three times faster than a human heart.",
            "Isaac Newton is said to have invented the cat door.",
            "Cats have an extra organ that allows them to taste scents in the air.",
            "A cat's jaw cannot move sideways, so they cannot chew large pieces.",
            "Most cats do not have eyelashes at all.",
            "A green or minty environment can calm a nervous kitten down.",
            "Cats can drink seawater to survive because their kidneys filter salt.",
            "The first cartoon cat was Felix the Cat, created in 1919.",
            "Cats usually prefer their food to be at room temperature.",
            "A cat's spine is super flexible because it has 53 loose vertebrae.",
            "Calico cats are almost always female due to genetics.",
            "Cats can track noises four times better than human beings.",
            "Male cats are more likely to be left-pawed than females.",
            "A cat's rough tongue acts like a comb to clean their fur.",
            "Cats don't like water because their coat doesn't dry fast.",
            "The largest cat breed is the Maine Coon.",
            "The smallest wild cat is the Rusty-spotted cat.",
            "Cats step with both left legs, then both right legs when walking.",
            "Cats can predict earthquakes due to their sensitive paw pads.",
            "A cat's memory can last up to 16 hours.",
            "Cats have been domesticated for more than 4,000 years.",
            "The ancient Egyptians shaved their eyebrows when their cat died.",
            "Cats have a special collarbone that always lets them land on their feet.",
            "A kitten's eyes are always blue when they are first born.",
            "Cats can process sounds much faster than dogs.",
            "A house cat is 95.6% genetically identical to a wild tiger.",
            "Cats prefer small spaces because it makes them feel safe.",
            "Purring can mean a cat is happy, scared, or even hurt.",
            "Cats always find a way to rule over their human servants."
        ];

        let unlockedFacts = JSON.parse(localStorage.getItem('unlockedFacts')) || [];
        let partyUnlocked = localStorage.getItem('partyUnlocked') === 'true';
        let partyHasHappened = localStorage.getItem('partyHasHappened') === 'true';
        let currentFactIndex = 0;
        let partyIntervals = [];

        function initAchievements() {
            const container = document.getElementById('badges-container');
            container.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.id = `badge-${i}`;
                badge.innerText = `Fact #${i + 1}`;
                if (unlockedFacts.includes(i)) {
                    badge.classList.add('unlocked');
                }
                container.appendChild(badge);
            }
            
            const specialBadge = document.createElement('div');
            specialBadge.className = 'badge special';
            specialBadge.id = 'badge-special';
            specialBadge.innerText = 'Cat Party! 🎉';
            if (partyUnlocked) {
                specialBadge.classList.add('unlocked');
            }
            container.appendChild(specialBadge);
            
            updateProgress();
        }
        function loadRandomFact() {
            if (unlockedFacts.length >= 50) {
                currentFactIndex = Math.floor(Math.random() * 50);
                document.getElementById('fact-num').innerText = `Fact #${currentFactIndex + 1}`;
                document.getElementById('fact-text').innerText = catFacts[currentFactIndex];
                document.getElementById('claim-button').disabled = true;
                document.getElementById('claim-button').innerText = "All Unlocked! 🌟";
                
                if (!partyHasHappened && !partyIntervals.length) {
                    triggerWarning();
                }
                return;
            }

            let availableIndexes = [];
            for (let i = 0; i < 50; i++) {
                if (!unlockedFacts.includes(i)) {
                    availableIndexes.push(i);
                }
            }

            currentFactIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            document.getElementById('fact-num').innerText = `Fact #${currentFactIndex + 1}`;
            document.getElementById('fact-text').innerText = catFacts[currentFactIndex];
            document.getElementById('claim-button').disabled = false;
            document.getElementById('claim-button').innerText = "Claim Achievement 🏆";
        }

        function claimAchievement() {
            if (!unlockedFacts.includes(currentFactIndex)) {
                unlockedFacts.push(currentFactIndex);
                localStorage.setItem('unlockedFacts', JSON.stringify(unlockedFacts));
                
                const badge = document.getElementById(`badge-${currentFactIndex}`);
                if (badge) badge.classList.add('unlocked');
                
                playAudio('https://mixkit.co');
                updateProgress();

                if (unlockedFacts.length >= 50) {
                    if (!partyHasHappened) {
                        triggerWarning();
                    } else {
                        loadRandomFact();
                    }
                } else {
                    loadRandomFact();
                }
            }
        }

        function updateProgress() {
            let total = unlockedFacts.length;
            if (partyUnlocked) total += 1;
            document.getElementById('progress-count').innerText = total;
        }

        function triggerWarning() {
            const warningScreen = document.getElementById('warning-screen');
            warningScreen.style.display = 'flex';
            let timeLeft = 20;
            
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-count').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    warningScreen.style.display = 'none';
                    startPartyEffect();
                }
            }, 1000);
        }

        function showAchievementPopup() {
            const popup = document.getElementById('achievement-popup');
            popup.style.right = '20px';
            
            setTimeout(() => {
                popup.style.right = '-350px';
            }, 4000);
        }

        function startPartyEffect() {
            document.getElementById('stop-party-btn').style.display = 'block';
            document.getElementById('cbox1').classList.add('dancing');
            document.getElementById('cbox2').classList.add('dancing');
            document.getElementById('cbox3').classList.add('dancing');

            if (!partyUnlocked) {
                partyUnlocked = true;
                localStorage.setItem('partyUnlocked', 'true');
                const sBadge = document.getElementById('badge-special');
                if (sBadge) sBadge.classList.add('unlocked');
                updateProgress();
                showAchievementPopup();
            }

            const flashInterval = setInterval(() => {
                const colors = ['#1f110a', '#34d399', '#4b2e1e', '#6ee7b7', '#2b1810', '#a7f3d0'];
                document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            }, 150);
            partyIntervals.push(flashInterval);

            const candyInterval = setInterval(() => {
                const candies = ['🍬', '🍫', '🍭', '🍩', '🍪', '💚', '🤎'];
                const candy = document.createElement('div');
                candy.className = 'candy-emoji';
                candy.innerText = candies[Math.floor(Math.random() * candies.length)];
                candy.style.left = Math.random() * 100 + 'vw';
                document.body.appendChild(candy);
                setTimeout(() => candy.remove(), 3000);
            }, 100);
            partyIntervals.push(candyInterval);
        }

        function stopParty() {
            partyIntervals.forEach(clearInterval);
            partyIntervals = [];
            
            document.querySelectorAll('.candy-emoji').forEach(el => el.remove());
            
            document.getElementById('stop-party-btn').style.display = 'none';
            document.getElementById('cbox1').classList.remove('dancing');
            document.getElementById('cbox2').classList.remove('dancing');
            document.getElementById('cbox3').classList.remove('dancing');
            
            document.body.style.backgroundColor = '#1f110a';
            
            partyHasHappened = true;
            localStorage.setItem('partyHasHappened', 'true');
            
            loadRandomFact();
        }

        function resetAchievements() {
            if (confirm("Are you sure you want to reset your achievements?")) {
                if (confirm("ARE YOU ABSOLUTELY SURE!??")) {
                    if (confirm("ON 101% ?!")) {
                        if (confirm("OH WELL, okay then...")) {
                            alert("Don't blame me later!");
                            
                            localStorage.removeItem('unlockedFacts');
                            localStorage.removeItem('partyUnlocked');
                            localStorage.removeItem('partyHasHappened');
                            
                            unlockedFacts = [];
                            partyUnlocked = false;
                            partyHasHappened = false;
                            
                            initAchievements();
                            loadRandomFact();
                        }
                    }
                }
            }
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(() => {});
        }

        window.onload = function() {
            initAchievements();
            loadRandomFact();
        };
    </script>

</body>
</html>
