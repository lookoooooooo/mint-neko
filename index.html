<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .nav-button {
            background: #4b2e1e;
            color: #6ee7b7;
            border: 3px dashed #34d399;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
            background: #3d2314;
        }
        h1 {
            color: #6ee7b7;
            text-shadow: 4px 4px #3d2314;
            font-size: 3.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            margin-bottom: 50px;
        }
        .box {
            border: 5px dashed #34d399;
            background: #2b1810;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .box:hover {
            transform: scale(1.03) rotate(-1deg);
            border-color: #6ee7b7;
            box-shadow: 0 0 25px rgba(110, 231, 183, 0.5);
        }
        .grid img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }
        .top-focus {
            object-position: center 10%;
        }
        button {
            background: #34d399;
            color: #1f110a;
            border: 3px solid #6ee7b7;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 6px #0f0805, 0 0 15px rgba(52, 211, 153, 0.4);
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px #0f0805;
        }
        #meow-counter {
            font-size: 1.8rem;
            margin-top: 20px;
            color: #6ee7b7;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
    </style>
</head>
<body>

    <a href="mint-choco.html" class="nav-button">ENTER MINT-CHOCO ZONE 🍫</a>

    <h1>MINT NEKO ZONE</h1>
    
    <button onclick="meowInteractive()">PRESS FOR MEOW</button>
    <div id="meow-counter">Total Meows: <span id="count">0</span></div>

    <div class="grid">
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat1.jpg" alt="Mint Cat" class="top-focus">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat2.jpg" alt="Neko Photo">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat3.jpg" alt="Chocolate Cat">
        </div>
    </div>
    <script>
        let meows = 0;

        function meowInteractive() {
            meows++;
            document.getElementById('count').innerText = meows;
            playAudio('https://mixkit.co');
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(43, 24, 16)' ? '#1f110a' : '#2b1810';
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
