<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko </title>
    <style>
        :root {
            --bg-color: #2b1d16;
            --header-bg: #3d2a1f;
            --text-color: #e6f9f3;
            --mint-primary: #98ffdb;
            --card-bg: #3d2a1f;
            --input-bg: #fff;
            --input-text: #2b1d16;
        }

        [data-theme="light"] {
            --bg-color: #e6f9f3;
            --header-bg: #98ffdb;
            --text-color: #2b1d16;
            --mint-primary: #3d2a1f;
            --card-bg: #bffff0;
            --input-bg: #fff;
            --input-text: #2b1d16;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; transition: 0.3s; }
        header { background-color: var(--header-bg); padding: 15px; text-align: center; border-bottom: 4px solid var(--mint-primary); position: relative; }
        h1 { color: var(--mint-primary); margin: 0; font-size: 28px; }
        
        .theme-toggle { position: absolute; left: 20px; top: 20px; background: var(--mint-primary); color: var(--bg-color); border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .account-box { position: absolute; right: 20px; top: 12px; display: flex; align-items: center; background: rgba(0,0,0,0.1); padding: 5px 10px; border-radius: 25px; }
        .avatar-slot { width: 40px; height: 40px; border-radius: 50%; background: #ccc; overflow: hidden; border: 2px solid var(--mint-primary); cursor: pointer; }
        .avatar-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* Всплывающее меню настроек аккаунта */
        .profile-modal { display: none; position: fixed; top: 70px; right: 20px; background: var(--card-bg); border: 2px solid var(--mint-primary); padding: 15px; border-radius: 12px; z-index: 2000; width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .modal-btn { background: var(--mint-primary); color: var(--bg-color); border: none; padding: 6px 10px; margin: 5px 0; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 12px; text-align: center; }

        #notification-container { position: fixed; right: 20px; top: 80px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; max-width: 300px; }
        .toast-notification { background: var(--card-bg); color: var(--text-color); padding: 12px; border-radius: 8px; border-left: 5px solid #ff4757; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .tab-btn { background: var(--card-bg); color: var(--text-color); border: 2px solid var(--mint-primary); padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--mint-primary); color: var(--bg-color); }

        .upload-section { background: var(--card-bg); max-width: 500px; margin: 20px auto; padding: 20px; border-radius: 12px; border: 2px dashed var(--mint-primary); }
        input, textarea, select, .action-submit { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; font-size: 14px; display: block; margin-left: auto; margin-right: auto; }
        input[type="text"], textarea, select { background: var(--input-bg); color: var(--input-text); border: 1px solid #ccc; }
        .action-submit { background-color: var(--mint-primary); color: var(--bg-color); font-weight: bold; cursor: pointer; }

        .feed-container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        .content-card { background: var(--card-bg); margin: 25px auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .author-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(152,255,219,0.2); }
        .author-ava { width: 30px; height: 30px; border-radius: 50%; background: #aaa; overflow: hidden; }
        .author-ava img { width: 100%; height: 100%; object-fit: cover; }
        .author-name { font-weight: bold; color: var(--mint-primary); cursor: pointer; }
        .card-title { font-size: 18px; margin: 5px 0; font-weight: bold; }
        .card-desc { color: var(--text-color); opacity: 0.8; font-size: 14px; margin-bottom: 10px; }
        
        .media-box img, .media-box video { width: 100%; border-radius: 8px; background: #000; max-height: 400px; object-fit: contain; }
        .badge { background: #ff9f43; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px; }

        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
        <h1>Mint Neko 🌲🐱</h1>
        <p>The Mint-Choco Video Space</p>

        <div class="account-box">
            <div class="avatar-slot" onclick="toggleProfileModal()">
                <img id="my-avatar" src="https://unsplash.com" alt="Ava">
            </div>
            <div style="margin-left: 10px;">
                <span id="my-username" style="font-size:14px; font-weight:bold;">@NekoUser</span>
            </div>
        </div>

        <div class="profile-modal" id="profile-menu">
            <h4 style="margin: 0 0 10px 0; color: var(--mint-primary);">Account Settings</h4>
            <button class="modal-btn" onclick="changeNickname()">✏️ Change Nickname</button>
            <button class="modal-btn" onclick="triggerAvatarUpload()">🖼️ Change Avatar</button>
            <input type="file" id="ava-uploader" style="display:none;" accept="image/*" onchange="changeAvatar(event)">
            <button class="modal-btn" style="background:#ff4757; color:white; margin-top:10px;" onclick="toggleProfileModal()">Close</button>
        </div>
    </header>

    <div id="notification-container"></div>

    <div style="max-width: 500px; margin: 15px auto 15px auto; padding: 0 10px;">
        <input type="text" id="search-input" placeholder="🔍 Search by title or #hashtag..." oninput="searchContent()" style="width: 100%; border: 2px solid var(--mint-primary); background: var(--card-bg); color: var(--text-color); box-sizing: border-box; padding: 10px; border-radius: 20px;">
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">All Feed</button>
        <button class="tab-btn" id="tab-gallery" onclick="switchTab('gallery')">🍫 Choco Gallery</button>
        <button class="tab-btn" id="tab-shorts" onclick="switchTab('shorts')">🍦 Mint Choco Shorts</button>
        <button class="tab-btn" id="tab-long" onclick="switchTab('long')">🐈 Chocolate Cat Longs</button>
    </div>

    <div class="feed-container" id="feed"></div>

    <div class="messages-panel" id="messages-window">
        <h3 style="margin-top:0; color: var(--mint-primary); border-bottom: 2px solid var(--mint-primary); padding-bottom: 10px;">Inbox & Notifications</h3>
        <div class="msg-list" id="msg-content-list">
            <div class="msg-item" style="text-align: center; opacity: 0.6; padding: 20px 0;">No new notifications yet. You are all caught up! 🐾</div>
        </div>
        <button class="action-submit" style="background:#ff4757; color:white;" onclick="toggleMessages()">Close Inbox</button>
    </div>

    <div class="upload-modal" id="upload-window">
        <h3 style="text-align: center; margin-top:0; color: var(--mint-primary);">Create New Post 🚀</h3>
        <select id="content-type" onchange="checkUploadFields()">
            <option value="gallery">🍫 Choco Gallery (Images)</option>
            <option value="shorts">🍦 Mint Choco Shorts (Video)</option>
            <option value="long">🐈 Chocolate Cat Longs (Video max 4m)</option>
        </select>
        
        <label style="font-size:12px; display:block; margin: 5px 0 2px 20px;">Select Main File:</label>
        <input type="file" id="media-file" accept="image/*,video/*">
        
        <div id="cover-upload-box" style="display: none;">
            <label style="font-size:12px; display:block; margin: 5px 0 2px 20px; color: #ff9f43;">Select Video Cover (Image):</label>
            <input type="file" id="cover-file" accept="image/*">
        </div>

        <input type="text" id="content-title" placeholder="Enter title (use #hashtags)...">
        <textarea id="content-desc" placeholder="Enter description..." rows="2"></textarea>
        
        <button class="action-submit" onclick="publishContent()">Publish to Feed 🚀</button>
        <button class="action-submit" style="background:#ff4757; color:white; margin-top:5px;" onclick="toggleUploadModal()">Cancel</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('all')">🏠<span style="display:block;font-size:10px;">Home</span></div>
        <div class="nav-btn-plus" onclick="toggleUploadModal()">+</div>
        <div class="nav-item" onclick="toggleMessages()">📩<span style="display:block;font-size:10px;">Inbox</span></div>
    </div>
    <script>
        let currentUser = {
            username: localStorage.getItem('neko_name') || 'MintyCat',
            avatar: localStorage.getItem('neko_ava') || 'https://unsplash.com'
        };

        document.getElementById('my-username').innerText = '@' + currentUser.username;
        document.getElementById('my-avatar').src = currentUser.avatar;

        let posts = JSON.parse(localStorage.getItem('mint_neko_posts')) || [];
        let currentFilter = 'all';
        let searchQuery = '';

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                showNotification('Dark theme activated! 🍫');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                showNotification('Light theme activated! 🍦');
            }
        }

        function toggleProfileModal() {
            const menu = document.getElementById('profile-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function toggleUploadModal() {
            const win = document.getElementById('upload-window');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
            checkUploadFields();
        }

        function toggleMessages() {
            const win = document.getElementById('messages-window');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        }

        function changeNickname() {
            const newName = prompt('Enter your new nickname:', currentUser.username);
            if (newName) {
                currentUser.username = newName.replace(/\s+/g, '');
                localStorage.setItem('neko_name', currentUser.username);
                document.getElementById('my-username').innerText = '@' + currentUser.username;
                showNotification('Nickname updated to @' + currentUser.username + '!');
            }
        }

        function triggerAvatarUpload() {
            document.getElementById('ava-uploader').click();
        }

        function changeAvatar(event) {
            const file = event.target.files;
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    localStorage.setItem('neko_ava', currentUser.avatar);
                    document.getElementById('my-avatar').src = currentUser.avatar;
                    showNotification('Avatar changed successfully!');
                    renderFeed();
                };
                reader.readAsDataURL(file);
            }
        }

        function showNotification(text) {
            const container = document.getElementById('notification-container');
            const noti = document.createElement('div');
            noti.className = 'toast-notification';
            noti.innerHTML = '🔔 ' + text;
            container.appendChild(noti);
            setTimeout(function() { noti.remove(); }, 4000);
        }

        function checkUploadFields() {
            const type = document.getElementById('content-type').value;
            const fileInput = document.getElementById('media-file');
            const coverBox = document.getElementById('cover-upload-box');
            
            if (type === 'gallery') {
                fileInput.accept = 'image/*';
                coverBox.style.display = 'none';
            } else {
                fileInput.accept = 'video/*';
                if (type === 'long') {
                    coverBox.style.display = 'block';
                } else {
                    coverBox.style.display = 'none';
                }
            }
        }

        function switchTab(type) {
            currentFilter = type;
            document.querySelectorAll('.tab-btn').forEach(function(btn) { 
                btn.classList.remove('active'); 
            });
            
            const activeTab = document.getElementById('tab-' + type);
            if (activeTab) {
                activeTab.classList.add('active');
            }
            renderFeed();
        }

        function searchContent() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            renderFeed();
        }
        function addLike(postId) {
            posts = posts.map(function(post) {
                if (post.id === postId) {
                    post.likes = (post.likes || 0) + 1;
                    showNotification('You liked this post!');
                }
                return post;
            });
            localStorage.setItem('mint_neko_posts', JSON.stringify(posts));
            renderFeed();
        }

        function deletePost(postId) {
            if (confirm('Are you sure you want to delete this minty post? 🙀')) {
                posts = posts.filter(function(post) { return post.id !== postId; });
                localStorage.setItem('mint_neko_posts', JSON.stringify(posts));
                showNotification('Post successfully removed!');
                renderFeed();
            }
        }

        function publishContent() {
            const fileInput = document.getElementById('media-file');
            const coverInput = document.getElementById('cover-file');
            const titleInput = document.getElementById('content-title');
            const descInput = document.getElementById('content-desc');
            const typeSelect = document.getElementById('content-type');

            if (!fileInput.files || !titleInput.value) {
                return alert('Please select a file and enter a title!');
            }

            const mainReader = new FileReader();
            mainReader.onload = function(e) {
                const mediaDataUrl = e.target.result;

                if (typeSelect.value === 'long' && coverInput.files) {
                    const coverReader = new FileReader();
                    coverReader.onload = function(cEvent) {
                        saveAndPost(typeSelect.value, titleInput.value, descInput.value, mediaDataUrl, cEvent.target.result);
                    };
                    coverReader.readAsDataURL(coverInput.files);
                } else {
                    saveAndPost(typeSelect.value, titleInput.value, descInput.value, mediaDataUrl, '');
                }
            };
            mainReader.readAsDataURL(fileInput.files);
        }

        function saveAndPost(type, title, desc, mediaUrl, coverUrl) {
            const newPost = {
                id: Date.now(),
                author: currentUser.username,
                authorAva: currentUser.avatar,
                type: type,
                title: title,
                desc: desc,
                mediaUrl: mediaUrl,
                coverUrl: coverUrl,
                likes: 0
            };

            posts.unshift(newPost);
            localStorage.setItem('mint_neko_posts', JSON.stringify(posts));

            document.getElementById('media-file').value = '';
            document.getElementById('cover-file').value = '';
            document.getElementById('content-title').value = '';
            document.getElementById('content-desc').value = '';

            toggleUploadModal();
            showNotification('Your post published to Mint Neko!');
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            let filtered = posts.filter(function(p) { return currentFilter === 'all' || p.type === currentFilter; });

            if (searchQuery) {
                filtered = filtered.filter(function(p) {
                    return p.title.toLowerCase().indexOf(searchQuery) !== -1 || p.desc.toLowerCase().indexOf(searchQuery) !== -1;
                });
            }

            if (filtered.length === 0) {
                feed.innerHTML = '<p style="text-align:center; opacity:0.6; padding-top:20px;">No content found...</p>';
                return;
            }

            filtered.forEach(function(post) {
                const card = document.createElement('div');
                card.className = 'content-card';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'author-info';
                
                const avaDiv = document.createElement('div');
                avaDiv.className = 'author-ava';
                const avaImg = document.createElement('img');
                avaImg.src = post.authorAva;
                avaDiv.appendChild(avaImg);
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'author-name';
                nameDiv.innerText = '@' + post.author;
                nameDiv.onclick = function() { viewUserProfile(post.author); };
                
                infoDiv.appendChild(avaDiv);
                infoDiv.appendChild(nameDiv);
                card.appendChild(infoDiv);

                const badgeSpan = document.createElement('span');
                badgeSpan.className = 'badge';
                if (post.type === 'gallery') badgeSpan.innerText = '🍫 Choco Gallery';
                else if (post.type === 'shorts') badgeSpan.innerText = '🍦 Mint Choco Shorts';
                else badgeSpan.innerText = '🐈 Chocolate Cat Longs';
                card.appendChild(badgeSpan);

                const titleDiv = document.createElement('div');
                titleDiv.className = 'card-title';
                titleDiv.innerText = post.title;
                card.appendChild(titleDiv);

                const descDiv = document.createElement('div');
                descDiv.className = 'card-desc';
                descDiv.innerText = post.desc;
                card.appendChild(descDiv);

                const mediaBox = document.createElement('div');
                mediaBox.className = 'media-box';
                if (post.type === 'gallery') {
                    const img = document.createElement('img');
                    img.src = post.mediaUrl;
                    mediaBox.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.controls = true;
                    video.src = post.mediaUrl;
                    if (post.type === 'long' && post.coverUrl) {
                        video.poster = post.coverUrl;
                    }
                    mediaBox.appendChild(video);
                }
                card.appendChild(mediaBox);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                const likeBtn = document.createElement('button');
                likeBtn.className = 'action-btn';
                likeBtn.innerText = '💚 Like (' + (post.likes || 0) + ')';
                likeBtn.onclick = function() { addLike(post.id); };
                actionsDiv.appendChild(likeBtn);

                const replyBtn = document.createElement('button');
                replyBtn.className = 'action-btn';
                replyBtn.innerText = '💬 Reply';
                replyBtn.onclick = function() { showNotification('Reply notification sent to @' + post.author + '!'); };
                actionsDiv.appendChild(replyBtn);

                if (post.author === currentUser.username) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn';
                    deleteBtn.style.color = '#ff4757';
                    deleteBtn.style.borderColor = '#ff4757';
                    deleteBtn.innerText = '🗑 Delete';
                    deleteBtn.onclick = function() { deletePost(post.id); };
                    actionsDiv.appendChild(deleteBtn);
                }

                card.appendChild(actionsDiv);
                feed.appendChild(card);
            });
        }

        function viewUserProfile(name) {
            if (name === currentUser.username) {
                alert('This is you (@' + name + ')! You can edit yourself via the avatar button in the header.');
            } else {
                alert('Viewing @' + name + 's profile. Only @' + name + ' can change their data, you can only watch!');
            }
        }

        renderFeed();
    </script>
</body>
</html>
