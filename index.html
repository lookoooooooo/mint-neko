<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Neko</title>
    <style>
        * {
            cursor: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='32' height='32' viewBox='0 0 24 24'%3E%3Cpath fill='%2334d399' d='M12 14c1.66 0 3-1.34 3-3s-1.34-3-3-3s-3 1.34-3 3s1.34 3 3 3zm-4.5-2c.83 0 1.5-.67 1.5-1.5S8.33 9 7.5 9S6 9.67 6 10.5S6.67 12 7.5 12zm9 0c.83 0 1.5-.67 1.5-1.5S17.33 9 16.5 9S15 9.67 15 10.5S15.67 12 16.5 12zm-4.5-5c.83 0 1.5-.67 1.5-1.5S12.83 4 12 4s-1.5.67-1.5 1.5S11.17 7 12 7z'/%3E%3C/svg%3E") 16 16, auto !important;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #6ee7b7;
            text-shadow: 4px 4px #3d2314;
            font-size: 3.8rem;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .box {
            border: 5px dashed #34d399;
            background: #2b1810;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .box:hover {
            transform: scale(1.03) rotate(-1deg);
            border-color: #6ee7b7;
            box-shadow: 0 0 25px rgba(110, 231, 183, 0.5);
        }
        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }
        .top-focus {
            object-position: center 10%;
        }
        button {
            background: #34d399;
            color: #1f110a;
            border: 3px solid #6ee7b7;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 6px #0f0805, 0 0 15px rgba(52, 211, 153, 0.4);
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px #0f0805;
        }
        #meow-counter {
            font-size: 1.8rem;
            margin-top: 20px;
            color: #6ee7b7;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
        .corner-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 120px;
            height: 120px;
            transition: transform 0.2s;
        }
        .corner-widget2 {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            width: 120px;
            height: 120px;
            transition: transform 0.2s;
        }
        .corner-widget:hover, .corner-widget2:hover {
            transform: scale(1.1);
        }
        .corner-widget img, .corner-widget2 img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        .bubble {
            position: fixed;
            bottom: 150px;
            right: 20px;
            background: #34d399;
            color: #1f110a;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            max-width: 200px;
            font-size: 0.9rem;
            border: 2px solid #6ee7b7;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            text-align: left;
        }
        .bubble-left {
            position: fixed;
            bottom: 150px;
            left: 20px;
            background: #6ee7b7;
            color: #1f110a;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            max-width: 200px;
            font-size: 0.9rem;
            border: 2px solid #34d399;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>MINT NEKO ZONE</h1>
    
    <button onclick="meowInteractive()">PRESS FOR MEOW</button>
    <div id="meow-counter">Total Meows: <span id="count">0</span></div>

    <div class="grid">
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat1.jpg" alt="Mint Cat" class="top-focus">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat2.jpg" alt="Neko Photo">
        </div>
        <div class="box" onclick="playAudio('https://mixkit.co')">
            <img src="cat3.jpg" alt="Chocolate Cat">
        </div>
    </div>

    <div class="bubble" id="quote-bubble"></div>
    <div class="corner-widget" onclick="showNekoTalk()">
        <img src="ВСТАВЬТЕ_СЮДА_ПРАМУЮ_ССЫЛКУ_НА_ПЕРВУЮ_ГИФКУ" alt="Widget Neko 1">
    </div>

    <div class="bubble-left" id="fortune-bubble"></div>
    <div class="corner-widget2" onclick="showNekoFortune()">
        <img src="ВСТАВЬТЕ_СЮДА_ПРАМУЮ_ССЫЛКУ_НА_ВТОРУЮ_ГИФКУ" alt="Widget Neko 2">
    </div>

    <script>
        let meows = 0;
        let bubbleTimeout;
        let fortuneTimeout;
        
        const phrases = [
            "Feed me mint ice cream!", "Meow? Purr...", "Humans are so boring.", "Is it nap time yet?",
            "Give me more chocolate!", "I rule this mint zone.", "Pet my head, please.", "Catching lasers is my job.",
            "Meow means YES.", "More meows, more power!", "Look at my cute nose.", "Do you have snacks?",
            "Mint and chocolate is best.", "Sleeping 18 hours today.", "Don't touch my paws!", "Paws up!",
            "I see a bird outside.", "Can I bite your keyboard?", "Neko energy activated.", "Everything belongs to me.",
            "Stay minty, friend.", "Purrfectly sweet.", "Just a little kitten.", "Meow all day long.",
            "I love this website.", "Where is my fish?", "Chasing my own tail.", "Wake up and pet me.",
            "Best neko in the world.", "Munching on grass..."
        ];

        const fortunes = [
            "Cat fortune: You will find a hidden snack today!",
            "Neko mission: Go drink some clean water right now!",
            "Cat fortune: A very fluffy cat thinks about you.",
            "Neko mission: Softly pet the nearest soft object.",
            "Cat fortune: Your next 5 meows will bring good luck.",
            "Neko mission: Take a 10-minute cozy cat nap.",
            "Cat fortune: Someone will buy you chocolate soon!",
            "Neko mission: Stretch your spine like a happy kitten.",
            "Cat fortune: You are the chosen one in the mint zone.",
            "Neko mission: Look out the window and look for birds."
        ];

        function meowInteractive() {
            meows++;
            document.getElementById('count').innerText = meows;
            playAudio('https://mixkit.co');
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(43, 24, 16)' ? '#1f110a' : '#2b1810';
        }

        function showNekoTalk() {
            clearTimeout(bubbleTimeout);
            playAudio('https://mixkit.co');
            const bubble = document.getElementById('quote-bubble');
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            bubble.innerText = randomPhrase;
            bubble.style.display = 'block';
            const displayTime = randomPhrase.length <= 20 ? 2500 : 4000;
            bubbleTimeout = setTimeout(() => { bubble.style.display = 'none'; }, displayTime);
        }

        function showNekoFortune() {
            clearTimeout(fortuneTimeout);
            playAudio('https://mixkit.co');
            const bubble = document.getElementById('fortune-bubble');
            const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            bubble.innerText = randomFortune;
            bubble.style.display = 'block';
            const displayTime = randomFortune.length <= 25 ? 2500 : 4000;
            fortuneTimeout = setTimeout(() => { bubble.style.display = 'none'; }, displayTime);
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
