<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Games Zone</title>
    <style>
        * {
            cursor: url('cursor1.png') 16 16, auto !important;
            box-sizing: border-box;
        }
        body {
            background-color: #1f110a;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }
        #falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        .falling-item {
            position: absolute;
            top: -60px;
            pointer-events: none;
            animation: fall linear forwards;
            user-select: none;
        }
        .falling-image {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        @keyframes fall {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }
        .nav-button {
            background: #4b2e1e;
            color: #6ee7b7;
            border: 2px dashed #34d399;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }
        .nav-button.active-tab {
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .games-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            position: relative;
            z-index: 10;
        }
        .game-card {
            background: #2b1810;
            border: 4px solid #34d399;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 350px;
        }
        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fbbf24;
            border-bottom: 2px dashed #34d399;
            width: 100%;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .card-display {
            width: 100%;
            height: 140px;
            background: #000000;
            border: 3px inset #6ee7b7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 6px;
        }
        .worm-view {
            font-size: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .action-link {
            display: block;
            background: #fbbf24;
            color: #1f110a;
            border: 3px solid #fff;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            text-decoration: none;
            width: 100%;
            box-shadow: 0 4px #b45309;
        }
        .action-link:active {
            transform: translateY(2px);
            box-shadow: 0 2px #b45309;
        }
    </style>
</head>
<body>

    <div id="falling-container"></div>

    <div class="nav-links">
        <a href="index.html" class="nav-button">HOME FACTS 📑</a>
        <a href="mint-choco.html" class="nav-button">MINT-CHOCO ZONE 🍫</a>
        <a href="gacha.html" class="nav-button">GACHA STUDIO 🎰</a>
        <a href="trust-cat.html" class="nav-button">TRUST OSORE 🐱</a>
        <a href="folder-work.html" class="nav-button">FOLDER WORKSTATION 📁</a>
        <a href="other.html" class="nav-button active-tab">OTHER ZONE 🐛</a>
    </div>

    <div class="games-grid">

        <div class="game-card">
            <div class="card-title">🐛 OTHER ZONE</div>
            <div class="card-display">
                <div class="worm-view">🐛</div>
            </div>
            <a href="caterpillar.html" class="action-link">LAUNCH GAME</a>
        </div>

        <div class="game-card">
            <div class="card-title">🎰 GACHA STUDIO</div>
            <div class="card-display">
                <img src="map1.jpg" alt="Gacha" class="card-img">
            </div>
            <a href="gacha.html" class="action-link">LAUNCH GAME</a>
        </div>

        <div class="game-card">
            <div class="card-title">🐱 TRUST OSORE</div>
            <div class="card-display">
                <img src="cat-admin1.png" alt="Osore" class="card-img">
            </div>
            <a href="trust-cat.html" class="action-link">LAUNCH GAME</a>
        </div>

        <div class="game-card">
            <div class="card-title">📁 FOLDER WORKSTATION</div>
            <div class="card-display">
                <img src="desktop-bg.jpg" alt="Workstation" class="card-img">
            </div>
            <a href="folder-work.html" class="action-link">LAUNCH GAME</a>
        </div>

    </div>

    <script>
        const fallingContainer = document.getElementById('falling-container');
        
        const fConfig = {
            images: [
                'https://unsplash.com',
                'https://unsplash.com',
                'https://unsplash.com',
                'https://unsplash.com'
            ],
            emojis: ['✨', '🌸', '💫', '🔮', '🌟', '🍒', '🧸', '🎀', '🐛'],
            kaomoji: ['(◌⚈  ⚈◌)', '(〃ω〃)', '(*^ω^*)', '(◕‿◕✿)', '╰(*´︶`*)╯', '(｡♥‿♥｡)'],
            words: ['Dream', 'Magic', 'Cosmic', 'Aesthetic', 'Serenity', 'Bliss', 'Ethereal'],
            colors: ['#ff79c6', '#8be9fd', '#50fa7b', '#ffb86c', '#bd93f9', '#ff5555']
        };

        function spawnItem() {
            const item = document.createElement('div');
            item.className = 'falling-item';
            
            const types = ['image', 'emoji', 'kaomoji', 'word', 'circle'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let content = '';
            let styleStr = '';
            
            if (type === 'image') {
                const src = fConfig.images[Math.floor(Math.random() * fConfig.images.length)];
                content = `<img src="${src}" class="falling-image">`;
            } else if (type === 'emoji') {
                content = fConfig.emojis[Math.floor(Math.random() * fConfig.emojis.length)];
                styleStr += `font-size: ${Math.random() * 15 + 22}px;`;
            } else if (type === 'kaomoji') {
                content = fConfig.kaomoji[Math.floor(Math.random() * fConfig.kaomoji.length)];
                styleStr += `font-size: ${Math.random() * 8 + 14}px; color: ${fConfig.colors[Math.floor(Math.random() * fConfig.colors.length)]}; font-weight: bold; white-space: nowrap;`;
            } else if (type === 'word') {
                content = fConfig.words[Math.floor(Math.random() * fConfig.words.length)];
                styleStr += `font-size: ${Math.random() * 8 + 14}px; color: ${fConfig.colors[Math.floor(Math.random() * fConfig.colors.length)]}; font-weight: 600; letter-spacing: 1px; white-space: nowrap;`;
            } else if (type === 'circle') {
                const size = Math.random() * 25 + 10;
                const color = fConfig.colors[Math.floor(Math.random() * fConfig.colors.length)];
                styleStr += `width: ${size}px; height: ${size}px; background-color: ${color}; border-radius: 50%; opacity: 0.5; box-shadow: 0 0 10px ${color};`;
            }

            item.innerHTML = content;
            if (styleStr) item.style.cssText = styleStr;

            item.style.left = Math.random() * 95 + 'vw';
            
            const duration = Math.random() * 6 + 6;
            item.style.animationDuration = duration + 's';
            
            const delay = Math.random() * 3;
            item.style.animationDelay = '-' + delay + 's';

            fallingContainer.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, (duration + delay) * 1000);
        }

        for (let i = 0; i < 25; i++) {
            setTimeout(spawnItem, Math.random() * 2000);
        }

        setInterval(spawnItem, 450);
    </script>
</body>
</html>
