<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Choco Aesthetics</title>
    <style>
        * {
            cursor: url('cursor2.png') 16 16, auto !important;
        }
        body {
            background-color: #a7f3d0;
            color: #2b1810;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
        }
        .nav-button {
            background: #2b1810;
            color: #34d399;
            border: 3px solid #1f110a;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #2b1810;
            text-shadow: 3px 3px #6ee7b7;
            font-size: 3.5rem;
        }
        .aesthetic-container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border: 4px solid #2b1810;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(43, 24, 16, 0.1);
        }
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: bold;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .gallery-box {
            border: 4px solid #2b1810;
            background: #f0fdf4;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gallery-box:hover {
            transform: scale(1.04) rotate(1deg);
            box-shadow: 0 8px 20px rgba(43, 24, 16, 0.15);
        }
        .gallery-box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #2b1810;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-button">← BACK TO FACTS QUEST</a>

    <h1>THE MINT-CHOCO ZONE</h1>

    <div class="aesthetic-container">
        <p>Welcome to the ultimate color experience. This zone is fully optimized for Mint & Chocolate textures.</p>
        
        <div class="gallery-grid">
            <div class="gallery-box" onclick="playMeow()">
                <img src="mint1.jpg" alt="Chocolate Mint Aesthetic 1">
            </div>
            <div class="gallery-box" onclick="playMeow()">
                <img src="mint2.jpg" alt="Chocolate Mint Aesthetic 2">
            </div>
            <div class="gallery-box" onclick="playMeow()">
                <img src="choco1.jpg" alt="Mint Chocolate Aesthetic 3">
            </div>
            <div class="gallery-box" onclick="playMeow()">
                <img src="choco2.jpg" alt="Mint Chocolate Aesthetic 4">
            </div>
        </div>

        <p>Enjoy your exclusive custom cursor here!</p>
    </div>

    <script>
        function playMeow() {
            const audio = new Audio('https://mixkit.co');
            audio.play().catch(() => {});
        }
    </script>

</body>
</html>
