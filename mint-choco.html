<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Choco Aesthetics</title>
    <style>
        * {
            cursor: url('cursor2.png') 16 16, auto !important;
        }
        body {
            background-color: #a7f3d0;
            color: #2b1810;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
        }
        .nav-button {
            background: #2b1810;
            color: #34d399;
            border: 3px solid #1f110a;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, background 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.05);
            background: #1f110a;
        }
        h1 {
            color: #2b1810;
            text-shadow: 3px 3px #6ee7b7;
            font-size: 3.5rem;
        }
        .aesthetic-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border: 6px double #2b1810;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(43, 24, 16, 0.1);
        }
        .color-palette {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .color-block {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #2b1810;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .mint1 { background-color: #a7f3d0; }
        .mint2 { background-color: #34d399; }
        .choco1 { background-color: #3d2314; }
        .choco2 { background-color: #1f110a; }
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-button">← BACK TO NEKO ZONE</a>

    <h1>THE MINT-CHOCO ZONE</h1>

    <div class="aesthetic-container">
        <p>Welcome to the ultimate color experience. This zone is fully optimized for Mint & Chocolate textures.</p>
        
        <div class="color-palette">
            <div class="color-block mint1"></div>
            <div class="color-block mint2"></div>
            <div class="color-block choco1"></div>
            <div class="color-block choco2"></div>
        </div>

        <p>Enjoy your exclusive custom cursor here!</p>
    </div>

</body>
</html>
